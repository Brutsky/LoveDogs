// suggest=true — карточка чужая (или старая уличная без автора): удаление не мгновенное,
// а через модерацию. Формулировки честно об этом говорят, чтобы человек не удивлялся,
// что собака осталась на карте.
function askDeleteDog(dogId, name, suggest) {
  openSheet(`
    <h3>${suggest ? `Предложить удалить «${escapeHtml(name)}»?` : `Удалить анкету «${escapeHtml(name)}»?`}</h3>
    ${suggest ? `<div class="list-sub" style="margin-bottom:8px">Эту анкету вносил не ты, поэтому запрос уйдёт модератору — собака исчезнет с карты только после подтверждения.</div>` : ''}
    <div class="field"><label>Почему? (обязательно — уйдёт админам на проверку)</label>
      <textarea id="delReason" maxlength="200" oninput="updCount(this,200)" placeholder="Например: дубль, собаки давно нет во дворе…"></textarea></div>
    <div class="btn-row">
      <button class="pop-btn secondary" onclick="closeSheet()">Отмена</button>
      <button class="pop-btn danger" onclick="submitDeleteDog('${dogId}')">${suggest ? t('ui_sendreq') : t('ui_delete')}</button>
    </div>
  `);
}
async function submitDeleteDog(dogId) {
  if (_inFlight['deleteDog']) return;   // защита от повторного нажатия
  _inFlight['deleteDog'] = true;
  try {
  const reason = document.getElementById('delReason').value.trim();
  if (!reason) { uiAlert(t('ms_reason')); return; }
  const res = await callApi('deleteDog', { dogId, reason });
  closeSheet();
  if (res.ok) {
    haptic(); dataCache.dogs = null; await renderLayer(); renderDogsScreen();
    if (res.duplicate) setStatus(t('ms_modwait'), 2600);
    else if (res.queued) setStatus(t('ms_modsent'), 2600);
    else setStatus(t('ms_deleted'), 2000);
  }
  else uiAlert(t('err_fail') + (res.error || ''));
  } finally { delete _inFlight['deleteDog']; }
}

async function renderProfileMyDogs() {

  let dogs = dataCache.dogs;
  if (!dogs) { try { dogs = await loadData('dogs'); } catch (e) { dogs = []; } }

  if (!mine.length) {
    // Пустой список без кнопки — тупик: человек видит, что собак нет, и не знает,
    // что с этим делать. Заводить собаку начинают отсюда чаще всего.
    box.innerHTML = `<div class="card">

// Опекунство (takeCare) убрано: в Грузии это юридическая процедура, и кнопка в
// приложении создавала впечатление оформленного статуса. Осталась только возможность
// снять себя как контакт по уличной собаке.
async function giveUpCare(dogId, name) {
  if (!await uiConfirm(`Убрать себя из контактов по «${name}»? Собака останется на карте, но связаться по ней будет не с кем, а отметка «ищет дом» снимется.`)) return;
  const res = await callApi('giveUpCare', { dogId });
  closeSheet();
  if (!res.ok) { uiAlert(t('err_fail') + (res.error || '')); return; }
  haptic(); dataCache.dogs = null; await renderLayer(); renderDogsScreen();

  // Находка без нашедшего перестаёт быть находкой. Дальше два исхода, и оба
  // требуют действия: либо поставить актуальное место, либо убрать карточку —
  // уличная собака без точки на карте бесполезна.
  if (res.needDelete) {
    await uiAlert(t('fo_gu_del'));
    askDeleteDog(dogId, name, true);
    return;
  }
  if (res.needGeo) {
    await uiAlert(t('fo_gu_geo'));
    setDogGeoFromCard(dogId);
    return;
  }
  setStatus(t('ms_giveup_ok'), 2200);
}

let addDogDraft = null;
// Быстрое добавление УЛИЧНОЙ собаки прямо с карты (частый полевой сценарий)

// Цвет бирки — из справочника, а не свободным текстом: так бирки сравнимы между собой.
const TAG_COLOR_OPTIONS = ['жёлтый', 'зелёный', 'красный'];
const FOUND_STATUS = 'Найдена';
const FOUND_NOTE_MAX = 300;   // как на сервере (FOUND_NOTE_MAX в dog_bot.gs)

// Форма «Новая собака»: три случая в одном месте — домашняя, уличная, найденная.
// Раньше найденную заводили только в боте, а уличную сервер отклонял («добавляй через
// бота»), хотя фото в форме уже можно было приложить. Теперь все три — здесь.
//   • ДОМАШНЯЯ — обязательна только кличка. Фото и место прогулки — рядом, всё прочее
//     в раскрывающейся «Дополнить анкету».
//   • УЛИЧНАЯ — бирка и её цвет первыми (по ним пса узнают надёжнее всего), затем
//     кличка, заметки, точка; обязательны кличка, точка и фото.
//   • НАЙДЕННАЯ — только то, что нашедший реально знает: фото, где собака сейчас,
//     место находки, описание. Рассылка о находке — отдельным переключателем.
// Обязательные поля помечены «*», внизу одна сноска — без «необязательно» у каждого поля.
function openAddDogSheet(draft) {
  addDogDraft = draft || addDogDraft || { status: 'У владельца' };
  const d = addDogDraft;
  const street = d.status === 'Уличная';
  const found = d.status === FOUND_STATUS;
  const statuses = [['У владельца', t('fd_home')], ['Уличная', t('fd_street')], [FOUND_STATUS, t('fd_found')]];

  const fName = `<div class="field"><label>${t('fd_name')}</label>
      <input type="text" id="adName" value="${escapeAttr(d.name || '')}" placeholder="${street ? t('ad_name_st') : t('fd_name_ph')}"></div>`;
  const fColor = `<div class="field"><label>${t('fd_color')}</label><input type="text" id="adColor" value="${escapeAttr(d.color || '')}" placeholder="${t('fd_color_ph')}"></div>`;
  const fTag = `<div class="field"><label>${t('fd_tag')}</label>
      <div class="field-row">
        <input type="text" id="adTagNum" placeholder="${t('fd_tag_ph')}" value="${escapeAttr(d.tagNumber || '')}">
        <select id="adTagColor" style="max-width:42%">${selOpts(TAG_COLOR_OPTIONS, d.tagColor, t('fd_tagcolor'))}</select>
      </div></div>`;
  const fBreed = `<div class="field"><label>${t('fd_breed')}</label>
      <select id="adBreedSel" onchange="document.getElementById('adBreedManual').style.display = this.value==='__manual__' ? 'block':'none'">
        ${selOpts(COMMON_BREEDS, d.breed, '—')}
        <option value="__manual__" ${d.breed === '__manual__' ? 'selected' : ''}>${t('fd_type_text')}</option>
      </select>
      <input type="text" id="adBreedManual" placeholder="${t('fd_breed_ph')}" style="display:${d.breed === '__manual__' ? 'block' : 'none'};margin-top:6px" value="${escapeAttr(d.breedManual || '')}"></div>`;
  const fSex = `<div class="field"><label>${t('fd_sex')}</label><select id="adSex">${selOpts(SEX_OPTIONS, d.sex, '—')}</select></div>`;
  const fAge = `<div class="field"><label>${t('fd_age')}</label><select id="adAge">${ageOptsHtml(d.age, '—')}</select></div>`;
  const fRegion = REGIONS_LIST.length ? `<div class="field"><label>${t('fd_region_tb')}</label><select id="adRegion">${selOpts(REGIONS_LIST, d.region, '—')}</select></div>` : '';
  const fSter = `<div class="field"><label>${t('fd_ster')}</label><select id="adSter">${selOpts(TRISTATE, d.sterilized || t('fd_unknown'))}</select></div>`;
  const fMemo = `<div class="field"><label>${t('fd_notes')}</label><textarea id="adMemo" maxlength="200" oninput="updCount(this,200)" placeholder="${street ? t('ad_memo_home') : t('ad_memo_st')}">${escapeHtml(d.memo || '')}</textarea></div>`;
  const geoNote = d.lat ? `<div class="geo-note">✅ ${Number(d.lat).toFixed(5)}, ${Number(d.lng).toFixed(5)}</div>` : '';
  const fGeo = found
    ? `<div class="field"><label>${t('fo_where_found')}</label>
         <button class="pop-btn ${d.lat ? 'secondary' : ''}" onclick="addDogPickGeo()">${d.lat ? t('fd_pin_set') : t('fd_pin')}</button>${geoNote}</div>`
    : street
      ? `<button class="pop-btn ${d.lat ? 'secondary' : ''}" onclick="addDogPickGeo()">${d.lat ? t('fd_pin_set') : t('fd_pin') + ' *'}</button>${geoNote}`
      : `<button class="pop-btn secondary" onclick="addDogPickGeo()">${d.lat ? t('fd_pin_set') : t('ad_pin_walk')}</button>${geoNote}`;
  const fPhoto = `<div class="field">
      <label>📷 ${t('ui_photo')}${(street || found) ? ' *' : ''}</label>
      <div id="adPhotoBox" class="photo-pick ${d._photoKey ? 'has' : ''}"
           onclick="pickDogPhotoForForm()"
           style="${d._photoKey ? `background-image:url('${photoUrlFromKey(d._photoKey)}')` : ''}">
        ${d._photoKey ? `<span class="rep">${t('ad_photo_rep')}</span>` : `<span class="ic">📷</span><span class="tx">${t('ad_photo_pick')}</span>`}
      </div>
      ${street ? `<div class="hint">${t('ad_photo_st')}</div>` : ''}
    </div>`;
  const more = (inner) => `
    <details class="more tap" ${d._moreOpen ? 'open' : ''} ontoggle="addDogDraft._moreOpen = this.open">
      <summary>${t('ad_more')}</summary>
      <div style="padding-top:10px">${inner}</div>
    </details>`;

  let body = '';
  if (found) {
    // Находка: фото → где собака сейчас → место → описание → контакты → рассылка.
    const where = [['1', t('fo_withme')], ['0', t('fo_onspot')]];
    const wm = (d.foundWithMe === 1 || d.foundWithMe === 0) ? String(d.foundWithMe) : '';
    body = fPhoto +
      `<div class="field"><label>${t('fo_where_now')}</label>
         <div class="seg-pick" id="adFoundWhere">${where.map(([v, l]) =>
           `<div class="opt ${wm === v ? 'active' : ''}" data-v="${v}">${l}</div>`).join('')}</div></div>` +
      fGeo +
      `<div class="field"><label>${t('fo_note')}</label>
         <textarea id="adFoundNote" maxlength="${FOUND_NOTE_MAX}" oninput="updCount(this,${FOUND_NOTE_MAX})" placeholder="${t('fo_note_ph')}">${escapeHtml(d.foundNote || '')}</textarea></div>` +
      `<div class="hint" style="margin:0 0 12px">${foundContactsInfoHtml()}</div>` +
      `<div class="field-row" style="justify-content:space-between;margin:0 0 14px">
         <span style="font-size:14px;font-weight:600">${t('fo_announce')}</span>
         <label class="switch"><input type="checkbox" id="adAnnounce" ${d.announce ? 'checked' : ''} onchange="onFoundAnnounceToggle(this)"><span class="slider-t"></span></label>
       </div>`;
  } else if (street) {
    body = fTag + fName + fMemo + fGeo + more([fColor, fBreed, fSex, fAge, fRegion, fSter].join('')) +
      '<div style="height:8px"></div>' + fPhoto;
  } else {
    body = fName + fPhoto + fGeo + more([fBreed, fColor, fSex, fAge, fRegion, fSter, fTag, fMemo].join(''));
  }

  const hint = found ? '' : `<div class="hint">${street ? t('ad_hint_st2') : t('ad_hint_home2')}</div>`;
  openSheet(`
    <h3>${t('fd_new')}</h3>
    <div class="field"><label>${t('fd_who')}</label>
      <div class="seg-pick" id="adStatus">${statuses.map(([v, l]) =>
        `<div class="opt ${d.status === v ? 'active' : ''}" data-v="${v}">${l}</div>`).join('')}</div>
      ${hint}
    </div>
    ${body}
    <div style="height:6px"></div>
    <button class="pop-btn" id="addDogSaveBtn" onclick="submitAddDog()">${t('fd_save')}</button>
    <div class="hint" style="margin-top:8px">${t('ad_req_note')}</div>
  `);

  document.querySelectorAll('#adStatus .opt').forEach(o => o.onclick = () => {
    // Тип меняет состав формы, поэтому сохраняем введённое и перерисовываем.
    collectAddDogDraft();
    addDogDraft.status = o.dataset.v;
    openAddDogSheet(addDogDraft);
  });
  document.querySelectorAll('#adFoundWhere .opt').forEach(o => o.onclick = () => {
    collectAddDogDraft();
    addDogDraft.foundWithMe = Number(o.dataset.v);
    document.querySelectorAll('#adFoundWhere .opt').forEach(x => x.classList.toggle('active', x === o));
  });
}

// Что увидят люди о нашедшем. Берём из профиля: Telegram-ник и телефон.
function foundContactsInfoHtml() {
  if (!me || !me.profile) return t('fo_contacts_unknown');   // профиль ещё грузится
  const p = me.profile;
  const tgName = (p.username || '').toString();
  const tel = (p.tel && p.tel !== 'Не указан') ? p.tel.toString() : '';
  if (!tgName && !tel) return t('fo_contacts_none');
  const parts = [];
  if (tgName) parts.push('<b>' + escapeHtml(tgName.charAt(0) === '@' ? tgName : '@' + tgName) + '</b>');
  if (tel) parts.push('<b>' + escapeHtml(tel) + '</b>');
  return t('fo_contacts').replace('{c}', parts.join(', '));
}

// Включение рассылки — только после явного подтверждения: сообщение уйдёт всему
// городу и содержит открытые контакты.
async function onFoundAnnounceToggle(el) {
  collectAddDogDraft();
  if (el.checked) {
    const ok = await uiConfirm(t('fo_announce_confirm'));
    el.checked = !!ok;
  }
  addDogDraft.announce = !!el.checked;
}

function collectAddDogDraft() {
  // Читаем только те поля, что есть на экране. Раньше отсутствующее поле возвращало
  // пустую строку и затирало уже введённое — при смене типа собаки данные пропадали.
  const map = { name: 'adName', breed: 'adBreedSel', breedManual: 'adBreedManual', color: 'adColor',
    sex: 'adSex', age: 'adAge', region: 'adRegion', sterilized: 'adSter',
    tagNumber: 'adTagNum', tagColor: 'adTagColor', memo: 'adMemo', foundNote: 'adFoundNote' };
  addDogDraft = addDogDraft || {};
  Object.keys(map).forEach(k => {
    const el = document.getElementById(map[k]);
    if (el) addDogDraft[k] = el.value;
  });
  const an = document.getElementById('adAnnounce');
  if (an) addDogDraft.announce = !!an.checked;
}
async function addDogPickGeo() {
  collectAddDogDraft();
  const choice = await pickOnMap(addDogDraft.lat ? [addDogDraft.lat, addDogDraft.lng] : null);
  if (choice) { addDogDraft.lat = choice.lat; addDogDraft.lng = choice.lng; }
  openAddDogSheet();
}
let addDogSubmitting = false;
async function submitAddDog() {
  if (_inFlight['addDog']) return;   // защита от повторного нажатия
  _inFlight['addDog'] = true;
  try {
  // Сохранение идёт заметное время (запись в таблицу, фото, уведомления), и без защиты
  // повторные тапы создавали ДУБЛИ анкет. Блокируем кнопку на время запроса.
  if (addDogSubmitting) return;
  collectAddDogDraft();
  const d = addDogDraft;
  const street = d.status === 'Уличная';
  const found = d.status === FOUND_STATUS;

  // Проверки в порядке полей на экране — первое незаполненное и называем.
  if (found) {
    if (!d._photoKey) { uiAlert(t('fo_err_photo')); return; }
    if (d.foundWithMe !== 1 && d.foundWithMe !== 0) { uiAlert(t('fo_err_where')); return; }
    if (!d.lat) { uiAlert(t('fo_err_geo')); return; }
    if (!(d.foundNote || '').trim()) {
      uiAlert(t('fo_err_note'));
      const el = document.getElementById('adFoundNote'); if (el) el.focus();
      return;
    }
  } else {
    if (!d.name || !d.name.trim()) {
      uiAlert(street ? t('ad_err_name_st') : t('ad_err_name'));
      const el = document.getElementById('adName'); if (el) el.focus();
      return;
    }
    if (street && !d.lat) { uiAlert(t('ad_err_geo')); return; }
    if (street && !d._photoKey) { uiAlert(t('ad_err_photo')); return; }
  }

  let payload;
  if (found) {
    payload = { status: FOUND_STATUS, lat: d.lat, lng: d.lng, photoKey: d._photoKey,
      foundWithMe: d.foundWithMe, foundNote: d.foundNote.trim(), announce: !!d.announce };
  } else {
    let breed = d.breed === '__manual__' ? (d.breedManual || '').trim() : d.breed;
    if (d.breed === '__manual__' && breed && !/^[A-Za-zА-Яа-яЁё\u10A0-\u10FF\s-]+$/.test(breed)) {
      uiAlert(t('ad_err_breed')); return;
    }
    payload = {
      status: d.status, name: d.name.trim(), breed, color: d.color, sex: d.sex, age: d.age,
      region: d.region || '', sterilized: d.sterilized, tagNumber: d.tagNumber,
      tagColor: d.tagColor, memo: d.memo, lat: d.lat || '', lng: d.lng || '',
      photoKey: d._photoKey || ''
    };
  }

  const btn = document.getElementById('addDogSaveBtn');
  addDogSubmitting = true;
  if (btn) { btn.disabled = true; btn.textContent = t('cm_sending'); }
  try {
    const res = await callApi('addDog', payload);
    if (res.ok) {
      // Новый сервер привязывает фото сам (photoAttached в ответе). Если ответ без этого
      // поля — значит, сервер ещё старой версии: привязываем отдельным запросом, как раньше.
      if (d._photoKey && res.id && res.photoAttached === undefined) {
        const at = await callApi('attachPhoto', { dogId: res.id, key: d._photoKey, asCover: true });
        if (!at || !at.ok) setStatus(t('ad_photo_fail'), 3500);
      } else if (res.photoAttached === false) {
        setStatus(t('ad_photo_fail'), 3500);
      }
      haptic(); addDogDraft = null; closeSheet();
      dataCache.dogs = null; await renderLayer(); renderDogsScreen();
      if (res.photoAttached !== false) {
        setStatus(found ? (res.announced ? t('fo_ok_sent') : t('fo_ok')) : t('ad_ok'), 2600);
      }
    } else if (res.error === 'limit') uiAlert(t('ad_err_limit'));
    else if (res.error === 'day_limit') uiAlert(t('ad_err_daylimit'));
    else if (res.error === 'duplicate') uiAlert(t('ad_err_dup'));
    else if (res.error === 'geo_required') uiAlert(found ? t('fo_err_geo') : t('ad_err_geo'));
    else if (res.error === 'photo_required') uiAlert(found ? t('fo_err_photo') : t('ad_err_photo'));
    else if (res.error === 'note_required') uiAlert(t('fo_err_note'));
    else if (res.error === 'where_required') uiAlert(t('fo_err_where'));
    else if (res.error === 'tag_exists' && res.dogId) {
      // Такая бирка уже в базе — это почти наверняка тот же пёс. Предлагаем открыть его.
      if (await uiConfirm(t('ad_err_tag_exists'))) {
        addDogDraft = null; closeSheet();
        dataCache.dogs = null; await renderLayer();
        const dog = findDog(res.dogId);
        if (dog) openDogCard(dog);
      }
    }
    else uiAlert(t('err_fail') + (res.error || ''));
  } finally {
    addDogSubmitting = false;
    if (btn) { btn.disabled = false; btn.textContent = t('fd_save'); }
  }
  } finally { delete _inFlight['addDog']; }
}

let dogSegment = 'all'; // по умолчанию — все собаки города (без фильтров)
// Порядок повторяет фильтры на карте: список — это то же самое, только другим
// представлением, и переключаться между ними не должно быть как между разными приложениями.
const DOG_SEGMENTS = [['all','Все'], ['home',`${DOG_ICONS.home} Домашние`], ['street',`${DOG_ICONS.street} Уличные`],
  ['lost',`${DOG_ICONS.lost} Потеряшки`], ['seeking',`${DOG_ICONS.seeking} Ищут дом`],
  ['donors',`${DOG_ICONS.donor} Доноры`], ['mine',`${DOG_ICONS.mine} Мои`]];
async function initDogsScreen() {
  await loadData('dogs');

  renderDogSegments();

function renderDogSegments() {
  const box = document.getElementById('dogSegments');
  box.innerHTML = '';

    const chip = document.createElement('div');

function fillRegionFilter() {
  const sel = document.getElementById('dogRegion');
  if (sel.options.length > 1 || !REGIONS_LIST.length) return;
  REGIONS_LIST.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
}
function renderDogsScreen() {
  fillRegionFilter();
  const list = dataCache.dogs || [];
  const q = (document.getElementById('dogSearch').value || '').trim().toLowerCase();
  const reg = document.getElementById('dogRegion').value;
  document.getElementById('donor-panel').classList.toggle('show', dogSegment === 'donors');
  // Город профиля: экран собак показывает только собак своего города (как и карта)
  const myCity = me && me.profile ? me.profile.city : null;
  let scoped = myCity ? list.filter(d => !d.city || d.city === myCity) : list;
  let filtered = scoped;
  // Пока идёт поиск — ищем по ВСЕЙ базе города, сегмент игнорируем (иначе «Мои» прячет чужих)
  if (!q) {
    if (dogSegment === 'mine') filtered = scoped.filter(d => d.mine);
    if (dogSegment === 'street') filtered = scoped.filter(d => d.status === 'Уличная');
    if (dogSegment === 'home') filtered = scoped.filter(d => d.status === 'У владельца');
    if (dogSegment === 'lost') filtered = scoped.filter(d => d.lost);
    if (dogSegment === 'seeking') filtered = scoped.filter(d => d.seekingHome);
    if (dogSegment === 'donors') {
      const minW = +document.getElementById('donorWeight').value;
      const vacc = document.getElementById('donorVacc').checked;
      const ster = document.getElementById('donorSter').checked;
      filtered = scoped.filter(d => d.isDonor
        && (Number(d.weightKg) || 0) >= minW
        && (!vacc || d.vaccinated === 'Да')
        && (!ster || d.sterilized === 'Да'));
    }
  }
  if (reg) filtered = filtered.filter(d => d.region === reg);
  if (q) {
    const tagQ = normalizeTag(q); // бирка: частичное совпадение от 4 знаков, кириллица=латиница
    filtered = filtered.filter(d =>
      (d.name || '').toLowerCase().includes(q) ||
      (d.breed || '').toLowerCase().includes(q) ||
      (d.color || '').toLowerCase().includes(q) ||
      (tagQ.length >= 4 && normalizeTag(d.tagNumber).includes(tagQ)));
  }

  const box = document.getElementById('dogsList');
  const addBtn = dogSegment === 'mine'
    ? `<button class="pop-btn" style="margin-bottom:12px" onclick="openAddDogSheet({status:'У владельца'})">➕ Добавить собаку</button>` : '';
  if (!filtered.length) {
    // Пустой экран должен предлагать выход, а не сообщать о неудаче. Раньше здесь был
    // тупик: «ничего не нашлось» — и всё, дальше человек либо гадает, либо уходит.
    const act = (label, onclick) => `<button class="pop-btn" style="margin-top:12px" onclick="${onclick}">${label}</button>`;
    const reset = act(t('ls_showall'), "dogSegment='all';document.getElementById('dogSearch').value='';renderDogSegments();renderDogsScreen()");
    const states = {
      mine:    { ico: '🐶', text: t('es_mine'),
                 btn: act(t('pf_adddog'), "openAddDogSheet({status:'У владельца'})") },
      lost:    { ico: '🎉', text: t('es_lost'), btn: reset },
      seeking: { ico: DOG_ICONS.seeking, text: t('es_seeking'),
                 btn: act(t('pf_adddog'), "openAddDogSheet({status:'Уличная'})") },
      donors:  { ico: DOG_ICONS.donor, text: t('es_donors'), btn: reset },
      home:    { ico: DOG_ICONS.home, text: t('es_home'), btn: reset },
      street:  { ico: DOG_ICONS.street, text: t('es_street'),
                 btn: act(t('es_addstreet'), "openAddDogSheet({status:'Уличная'})") },
      all:     { ico: DOG_ICONS.pack, text: t('es_all'),
                 btn: act(t('pf_adddog'), "openAddDogSheet({status:'У владельца'})") }
    };
    const st = q
      ? { ico: '🔍', text: `«${escapeHtml(q)}» — ${t('es_noquery')}`,
          btn: act(t('es_reset'), "document.getElementById('dogSearch').value='';renderDogsScreen()") }
      : (states[dogSegment] || states.all);
    box.innerHTML = addBtn + `<div class="empty"><div class="big">${st.ico}</div>${st.text}${st.btn}</div>`;
    return;
  }
  const statusIco = s => s === 'У владельца' ? DOG_ICONS.home : DOG_ICONS.street;
  box.innerHTML = addBtn + filtered.map(d => `
    <div class="card tappable" onclick="openDogCard(findDog('${d.id}'))">
      <div class="row-between">
        <div>
          <div class="list-title">${d.lost ? '🚨 ' : ''}${escapeHtml(d.name || t('pf_noname'))}</div>
          <div class="list-sub">${statusIco(d.status)} ${escapeHtml(d.status)} · ${escapeHtml(d.breed || t('ls_nobreed'))}${d.region ? ' · ' + escapeHtml(d.region) : (d.city && d.city !== 'Тбилиси' ? ' · ' + escapeHtml(d.city) : '')}</div>
        </div>
        <div style="font-size:22px">${d.mine ? '💛' : '🐕'}</div>
      </div>
      <div class="badges">
        ${d.seekingHome ? `<span class="badge ok">${t('b_seeking')}</span>` : ''}
        ${d.isDonor ? `<span class="badge">${t('ls_donor')} ${d.weightKg ? d.weightKg + t('d_kg') : ''}</span>` : ''}
        ${d.lost ? `<span class="badge warn">потерялась${d.lostDaysAgo != null ? ' · ' + d.lostDaysAgo + t('d_days') : ''}</span>` : ''}
        ${d.tagNumber ? '<span class="badge">🔖 ' + escapeHtml(d.tagNumber) + '</span>' : ''}
        ${!d.lat ? `<span class="badge">${t('ls_nogeo')}</span>` : ''}
      </div>
    </div>`).join('');
}

// Форматы услуг: ключ ↔ столбцы I/J/K листа DogSitter
const SITTER_SERVICES = {
  // Подписи берутся из словаря функциями: значения в объекте вычислились бы один раз
  // при загрузке, до того как станет известен язык профиля.
  justWalking: { icon: '🚶', short: () => t('sfm_walk_s'), label: () => t('sfm_walk_l'), hint: () => t('sfm_walk_h') },
  ownPlace:    { icon: '🏠', short: () => t('sfm_own_s'),  label: () => t('sfm_own_l'),  hint: () => t('sfm_own_h') },
  withLiving:  { icon: '🛋', short: () => t('sfm_live_s'), label: () => t('sfm_live_l'), hint: () => t('sfm_live_h') }
};
let sittersCache = null;   // список активных ситтеров моего города
let mySitterProfile = null; // моя анкета (даже неактивная) — для формы редактирования
let sitterFilter = 'all';
function openTgUser(username) {
  if (!username) return;
  const url = 'https://t.me/' + username;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
// Ситтеры грузились каждый раз заново, POST-запросом к холодному Apps Script: девять
// человек в списке, а ожидание такое же, как у карты. Теперь тот же приём, что и со
// слоями карты: показываем сохранённое сразу, свежее подтягиваем фоном.
function sittersCacheKey() { return 'ld_sitters_' + (MY_UID || 'anon'); }
function readSittersCache() {
  try {
    const box = JSON.parse(localStorage.getItem(sittersCacheKey()) || 'null');
    if (!box || !box.t || Date.now() - box.t > LAYER_CACHE_TTL) return null;
    return box;
  } catch (e) { return null; }
}
async function fetchSitters(quiet) {
  const res = await callApi('getSitters', {}, quiet);
  if (!res.ok) throw new Error(res.error || 'ошибка');
  const box = { t: Date.now(), sitters: res.sitters || [], mine: res.mine || null, city: res.city || '' };
  try { localStorage.setItem(sittersCacheKey(), JSON.stringify(box)); } catch (e) {}
  return box;
}
function applySittersBox(box) {
  sittersCache = box.sitters || [];
  mySitterProfile = box.mine || null;
  const cityEl = document.getElementById('sitterCity');
  if (cityEl) cityEl.textContent = box.city ? '· ' + box.city : '';
}
async function loadSitters(force) {
  if (sittersCache && !force) { renderSitters(); return; }

  const cached = force ? null : readSittersCache();
  if (cached) {
    applySittersBox(cached);
    renderSitters();
    if (Date.now() - cached.t < LAYER_FRESH_MS) return;
    // Данные постарше — обновляем молча, человеку уже есть что читать.
    fetchSitters(true).then(box => {
      const changed = JSON.stringify(box.sitters) !== JSON.stringify(cached.sitters);
      applySittersBox(box);
      if (changed && activeScreen === 'sitters') renderSitters();
    }).catch(() => {});
    return;
  }

  try {
    const box = await fetchSitters();
    applySittersBox(box);
    renderSitters();
  } catch (err) {
    sittersCache = sittersCache || [];
    renderSitters(String(err.message || err));
  }
}
function renderSitterFilters() {
  const box = document.getElementById('sitterFilters');
  box.innerHTML = '';
  const opts = [['all', t('sf_all')]].concat(Object.keys(SITTER_SERVICES).map(k => [k, SITTER_SERVICES[k].icon + ' ' + SITTER_SERVICES[k].short()]));
  opts.forEach(([k, label]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (sitterFilter === k ? ' active' : '');
    chip.textContent = label;
    chip.onclick = () => { sitterFilter = k; renderSitters(); };
    box.appendChild(chip);
  });
}
function sitterServiceBadges(s) {
  return Object.keys(SITTER_SERVICES)
    .filter(k => s[k])
    .map(k => `<span class="badge brand">${SITTER_SERVICES[k].icon} ${SITTER_SERVICES[k].label()}</span>`)
    .join('');
}
function renderSitters(err) {
  renderSitterFilters();
  const selfSlot = document.getElementById('sitterSelfSlot');
  const box = document.getElementById('sittersList');
  if (err) { box.innerHTML = `<div class="empty">Не получилось загрузить (${escapeHtml(err)})</div>`; return; }
  selfSlot.innerHTML = (mySitterProfile && mySitterProfile.active)
    ? `<div class="btn-row" style="margin-bottom:12px">
        <button class="pop-btn secondary" onclick="openBecomeSitterSheet(true)">${t('si_myform')}</button>
        <button class="pop-btn secondary" onclick="stopSitter()">${t('si_quit')}</button>
      </div>`
    : `<button class="pop-btn" style="margin-bottom:12px" onclick="openBecomeSitterSheet(!!mySitterProfile)">🙋 ${mySitterProfile ? t('si_back') : t('si_become')}</button>`;
  let list = sittersCache || [];
  if (sitterFilter !== 'all') list = list.filter(s => s[sitterFilter]);
  if (!list.length) {
    box.innerHTML = `<div class="empty"><div class="big">🧑</div>${sitterFilter === 'all' ? t('si_none') : t('si_none_fmt')}</div>`;
    return;
  }
  box.innerHTML = list.map(s => {
    const rating = s.rating != null ? `⭐ ${s.rating} (${s.ratingCount})` : (s.ratingCount ? `мало оценок (${s.ratingCount})` : t('si_norates'));
    return `<div class="card">
      <div class="row-between">
        <div class="list-title">${s.self ? '💛 ' : '🙋 '}${escapeHtml(s.name || t('si_word'))}</div>
        <span class="badge">${rating}</span>
      </div>
      <div class="badges">${sitterServiceBadges(s)}</div>

// Общая защита от двойного нажатия: экран может «думать» секунды, и человек жмёт
// второй раз — так появлялись дубли анкет и повторные заявки.
const _inFlight = {};
async function once(key, fn) {
  if (_inFlight[key]) return;
  _inFlight[key] = true;
  try { return await fn(); } finally { delete _inFlight[key]; }
}

async function showDogGallery(dogId, dogName, canEdit) {
  openSheet(`<h3>${t('gl_head')} — «${escapeHtml(dogName)}»</h3><div class="empty">Загружаю…</div>`);
  const r = await fetch(`${API_URL}?type=dogGallery&dogId=${encodeURIComponent(dogId)}&${initDataQS()}`);
  const j = await r.json().catch(() => ({ ok: false }));
  const photos = (j.ok ? j.photos : []) || [];
  const stamp = Date.now();                 // метка отрисовки: если лист успели закрыть, не дорисовываем
  window._galStamp = stamp;
  openSheet(`
    <h3>${t('gl_head')} — «${escapeHtml(dogName)}»</h3>
    ${photos.length ? `<div class="gallery-grid">${photos.map((p, i) => `
      <div class="gallery-item">
        <img id="galimg-${stamp}-${i}" alt="" loading="lazy" src="${photoUrlFromKey(p.thumbKey || p.key)}">
        ${p.isCover ? `<span class="gallery-cover-tag">${t('gl_cover')}</span>` : ''}
        ${(canEdit && !p.isCover) ? `<button class="gallery-del" onclick="deleteGalleryPhoto('${p.id}','${dogId}','${escapeAttr(dogName)}',${canEdit})">✕</button>` : ''}
      </div>`).join('')}</div>` : `<div class="empty">${t('gl_empty')}</div>`}
    ${canEdit ? `<button class="pop-btn secondary" style="margin-top:10px" onclick="openBotDeepLink('gallery_${dogId}')">${t('gl_add')}</button>` : ''}
  `);
  // Залитые в Storage уже проставлены в разметке и грузятся параллельно самим
  // браузером. Остаются только незалитые: они всё ещё идут через Apps Script, и вот
  // их по-прежнему берём по одной — параллельный залп упёрся бы в лимит
  // одновременных выполнений. Этот цикл исчезнет вместе с последним старым фото.
  for (let i = 0; i < photos.length; i++) {
    if (photoUrlFromKey(photos[i].thumbKey || photos[i].key)) continue;
    if (window._galStamp !== stamp) return;
    const src = await photoSrc(photos[i].fileId);
    const img = document.getElementById(`galimg-${stamp}-${i}`);
    if (img && src) img.src = src;
  }
}
async function deleteGalleryPhoto(photoId, dogId, dogName, canEdit) {
  const res = await callApi('deleteGalleryPhoto', { photoId, dogId });
  if (res.ok) { haptic(); showDogGallery(dogId, dogName, canEdit); }
  else uiAlert(t('err_fail') + (res.error || ''));
}

let commentSubmitting = false;
async function submitComment(dogId, dogName) {
  if (commentSubmitting) return; // повторный тап, пока запрос в полёте, — игнорируем
  const field = document.getElementById('commentText');
  const text = field.value.trim();
  if (!text) { uiAlert(t('cm_empty_text')); return; }
  const btn = document.getElementById('commentSendBtn');
  commentSubmitting = true;
  // Блокируем кнопку и показываем прогресс прямо на ней: раньше окно с введённым
  // текстом «висело» неизменным, и было неясно, ушёл ли комментарий — люди жали
  // второй раз и получали дубль.
  if (btn) { btn.disabled = true; btn.textContent = t('cm_sending'); }
  field.disabled = true;
  try {
    const res = await callApi('addComment', { dogId, text });
    if (res.ok) {
      haptic();
      // Дорисовываем комментарий на месте, без полной перезагрузки ленты через
      // промежуточный экран «Загружаю».
      const list = document.getElementById('commentsList');
      if (list) {
        const empty = list.querySelector('.empty');
        if (empty) empty.remove();
        const now = new Date();
        const stamp = String(now.getDate()).padStart(2, '0') + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + now.getFullYear() +
          ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `<div class="row-between"><span class="who">${escapeHtml(res.author || 'Ты')}</span></div>
          <div class="txt">${escapeHtml(text)}</div><div class="when">${escapeHtml(stamp)}</div>`;
        list.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      field.value = '';
    } else {
      uiAlert(t('err_fail') + (res.error || ''));
    }
  } finally {
    commentSubmitting = false;
    field.disabled = false;
    if (btn) { btn.disabled = false; btn.textContent = t('cm_send'); }
  }
}

async function suggestPickGeo(id) {
  const vals = collectSuggestVals();
  const p = (dataCache.places || []).find(x => x.id.toString() === id.toString());
  const choice = await pickOnMap(p && p.lat ? [p.lat, p.lng] : null);
  const cur = Object.assign({}, p, vals, { id, night: vals.night, closed: vals.closed, typeLabel: vals.type });
  openSuggestSheet(cur);
  if (choice) { pendingGeo = choice; document.getElementById('geo-status').textContent = t('ms_newpin'); }
}
function collectSuggestVals() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  return {
    name: g('sugName'), type: g('sugType'), address: g('sugAddress'), phone: g('sugPhone'),
    night: !!(document.getElementById('sugNight') || {}).checked,
    closed: !!(document.getElementById('sugClosed') || {}).checked
  };
}
async function submitSuggest(id) {
  const changes = collectSuggestVals();
  if (pendingGeo) { changes.lat = pendingGeo.lat; changes.lng = pendingGeo.lng; } // координаты как у собак
  const res = await callApi('suggestEdit', { type: 'Places', id, changes });

  if (res.ok) { haptic(); setStatus(t('ms_placeok'), 2600); }

}

// Полезные материалы вынесены из общего полотна профиля в отдельный экран:
// в ленте они выглядели как случайные карточки между настройками и поддержкой.
async function renderResourcesScreen() {
  const box = document.getElementById('resourcesBody');
  if (!box) return;
  // Материалы приезжают вместе с профилем. Экран можно открыть первым действием,
  // до getMe, — тогда ждём его, а не показываем «пока пусто».
  if (!me) { box.innerHTML = `<div class="empty">Загружаю…</div>`; try { await loadProfile(); } catch (e) {} }
  const list = (me && me.resources) || [];
  box.innerHTML = list.length ? list.map(r => `
    <div class="card tappable" onclick="openResourceLink('${escapeAttr(r.url || '')}')">
      <div class="list-title" style="font-size:14px">${resourceIcon(r.url)} ${escapeHtml(r.title)}</div>
      ${r.url ? `<div class="list-sub">${escapeHtml(r.url)}</div>` : ''}
    </div>`).join('') : `<div class="empty">${t('pf_empty_res')}</div>`;
}
function resourceIcon(url) {
  const u = (url || '').trim();
  if (u.startsWith('@') || u.indexOf('t.me/') !== -1) return '✉️';
  return '🔗';
}
// Ссылка вида «@username» — это контакт, а не адрес страницы. Раньше она уходила в
// window.open как относительный путь и открывала сам сайт мини-аппа (GitHub Pages).
function openResourceLink(url) {
  const u = (url || '').trim();
  if (!u) return;
  if (u.startsWith('@')) { openTgUser(u.slice(1)); return; }
  if (/^https?:\/\//i.test(u)) {
    if (u.indexOf('t.me/') !== -1) openTgLink(u); else window.open(u, '_blank');
    return;
  }
  if (u.indexOf('t.me/') === 0) { openTgLink('https://' + u); return; }
  window.open('https://' + u, '_blank');   // «example.com» без схемы — тоже адрес, а не путь
}

// Экран подписок на районы. Подписка приходит сама, когда добавляешь собаку или место,
// но снять её раньше можно было только в боте.
// Район отправляем ИНДЕКСОМ в справочнике, а не именем: имя проходило через
// экранирование при отрисовке и возвращалось на сервер изменённым, где сверка со
// справочником его не находила.
let _regionSubsCache = null;
async function openRegionSubs() {
  openSheet(`<h3>${t('sb_regions')}</h3><div class="empty">${t('loading')}</div>`);
  const res = await callApi('getRegionSubs', {});
  if (!res.ok) { openSheet(`<h3>${t('sb_regions')}</h3><div class="empty">${t('err_fail')}${escapeHtml(res.error || '')}
    <button class="pop-btn secondary" style="margin-top:12px" onclick="openSubsSheet()">${t('sb_back')}</button></div>`); return; }
  _regionSubsCache = { subs: res.subs || [], regions: res.regions || [] };
  renderRegionSubs();
}
function renderRegionSubs() {
  const { subs, regions } = _regionSubsCache || { subs: [], regions: [] };
  openSheet(`
    <h3>${t('sb_regions')}</h3>
    <div class="list-sub" style="margin-bottom:10px">${t('sb_regions_hint')}</div>
    ${regions.length ? `<div class="card">${regions.map((r, i) => `
      <div class="edit-row">
        <span style="color:var(--fg);font-size:15px">${escapeHtml(r)}</span>
        <label class="sw"><input type="checkbox" ${subs.indexOf(r) !== -1 ? 'checked' : ''}
          onchange="toggleRegionSub(${i})"><span></span></label>
      </div>`).join('')}</div>` : `<div class="empty">Справочник районов пуст — районы задаются в таблице (лист Lists, колонка 4)</div>`}
    <button class="pop-btn secondary" style="margin-top:12px" onclick="openSubsSheet()">${t('sb_back')}</button>
  `);
}
async function toggleRegionSub(idx) {
  if (!_regionSubsCache) return;
  const region = _regionSubsCache.regions[idx];
  if (!region) return;
  const res = await callApi('toggleRegionSub', { regionIndex: idx });
  if (!res.ok) {
    uiAlert(res.error === 'no_regions' ? t('er_noregions') : (t('err_fail') + (res.error || '')));
    return;
  }
  haptic();
  // Состояние держим у себя и перерисовываем список целиком: раньше иконку искали в
  // DOM по подстроке инлайн-стиля, и любая правка вёрстки тихо ломала отклик.
  const at = _regionSubsCache.subs.indexOf(region);
  if (res.subscribed && at === -1) _regionSubsCache.subs.push(region);
  if (!res.subscribed && at !== -1) _regionSubsCache.subs.splice(at, 1);
  renderRegionSubs();
  setStatus(res.subscribed ? `🔔 Подписка на ${region}` : `🔕 Отписка от ${region}`, 1800);
}

// Переключатель сохраняется сразу, по щелчку. Кнопка «Сохранить» здесь была лишним
// шагом: человек видит, что тумблер уже сдвинулся, и уходит, не нажав её, — настройка
// молча не применялась. Ошибку откатываем визуально, чтобы состояние тумблера не
// расходилось с тем, что на сервере.
async function saveSubToggle(field, value) {
  const el = document.getElementById(field === 'digest' ? 'swDigest' : 'swAlerts');
  const changes = {}; changes[field] = value;
  try {
    const res = await callApi('updateProfile', { changes }, true);
    if (!res || !res.ok) {
      if (el) el.checked = !value;
      uiAlert(t('err_fail') + ((res && res.error) || ''));
      return;
    }
    haptic();
    if (me && me.profile) me.profile[field] = value;
    if (activeScreen === 'profile') renderProfile();
    setStatus(t('ms_savedok'), 1400);
  } catch (e) {
    if (el) el.checked = !value;
    uiAlert(t('err_fail'));
  }
}

// Сохранение одного поля профиля. Без перезагрузки всего экрана: полный reload
// сбрасывал бы фокус и прокрутку прямо во время правки следующего поля.
async function saveProfileField(field, value) {
  if (!me || !me.profile) return;
  const before = me.profile[field];
  if (String(before || '') === String(value || '')) return;   // ничего не поменялось
  const res = await callApi('updateProfile', { changes: { [field]: value } }, true);
  if (!res || !res.ok) {
    uiAlert(t('err_fail') + ((res && res.error) || ''));
    renderProfile();   // вернуть прежнее значение на экран
    return;
  }
  me.profile[field] = value;
  haptic();
  setStatus(t('pf_saved'), 1600);
  // Язык и город меняют не только эту строку: язык — все надписи, город — центр карты.
  if (field === 'lang') { syncLangFromProfile(me.profile); applyStaticI18n(); renderProfile(); }
  if (field === 'city') { centerMapByCity(value); dataCache.dogs = null; renderLayer(); }
  if (field === 'name') {
    const titleEl = document.getElementById('profileTitle');
    if (titleEl) renderProfile();
  }
}


// ================== ЗАГРУЗКА ФОТО ==================
// Снимок уходит в Supabase Storage напрямую из браузера по подписанной ссылке —
// мимо Apps Script. Через скрипт гонять байты нельзя: это и медленно, и упирается в
// предел размера запроса. Перед отправкой уменьшаем: с телефона приходят снимки на
// 4–8 МБ, а в карточке они показываются шириной в экран.
const UPLOAD_MAX_SIDE = 1600;
const UPLOAD_QUALITY = 0.82;

function pickImageFile() {
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = () => resolve(inp.files && inp.files[0] ? inp.files[0] : null);
    // Отмена выбора события не даёт вовсе — поэтому промис просто останется висеть,
    // а ссылка на input умрёт вместе с ним. Утечки нет, зависшего интерфейса тоже.
    inp.click();
  });
}

// Уменьшение через canvas. EXIF-поворот браузеры применяют сами при отрисовке
// через createImageBitmap, поэтому отдельная возня с ориентацией не нужна.
async function shrinkImage(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, UPLOAD_MAX_SIDE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  try { bmp.close(); } catch (e) {}
  return await new Promise(res => canvas.toBlob(res, 'image/jpeg', UPLOAD_QUALITY));
}

// Выбрать → сжать → залить. Возвращает ключ объекта в хранилище либо null.
// Собаке снимок ещё не принадлежит: привязка отдельным шагом, потому что при
// заведении анкеты id собаки появляется уже после выбора фото.
async function pickAndUploadPhoto(statusText) {
  const file = await pickImageFile();
  if (!file) return null;
  if (!/^image\//.test(file.type)) { uiAlert(t('up_notimg')); return null; }
  setStatus(statusText || t('up_prep'));
  try {
    setBusy(true);
    const blob = await shrinkImage(file);
    const ticket = await callApi('photoUploadTicket', {}, true);
    if (!ticket || !ticket.ok || !ticket.uploadUrl) {
      uiAlert(t('up_start_err') + ((ticket && ticket.error) ? `: ${ticket.error}` : ''));
      return null;
    }
    setStatus(t('up_going'));
    const put = await fetch(ticket.uploadUrl, {
      method: 'PUT',
      headers: { 'content-type': 'image/jpeg' },
      body: blob
    });
    if (!put.ok) { uiAlert(t('up_failed')); return null; }
    return ticket.key;
  } catch (e) {
    uiAlert(t('up_procfail') + (e.message || e));
    return null;
  } finally { setBusy(false); setStatus(null); }
}

// Загрузить и сразу привязать к существующей собаке.
async function addPhotoToDog(dogId, asCover) {
  const key = await pickAndUploadPhoto();
  if (!key) return false;
  setBusy(true);
  try {
    const res = await callApi('attachPhoto', { dogId, key, asCover: !!asCover });
    if (!res || !res.ok) {
      uiAlert(t('up_attachfail') + ((res && res.error) ? `: ${res.error}` : '') + '.');
      return false;
    }
    haptic('success');
    setStatus(t('up_added'), 2200);
    return true;
  } finally { setBusy(false); }
}

// Выбор фото в форме заведения: грузим сразу, показываем превью. К собаке снимок
// привяжется после сохранения анкеты — id появляется только там.
async function pickDogPhotoForForm() {
  collectAddDogDraft();
  const key = await pickAndUploadPhoto(t('up_prep'));
  if (!key) return;
  addDogDraft._photoKey = key;
  haptic();
  openAddDogSheet(addDogDraft);
}

// Кнопка в карточке собаки.
async function addPhotoFromCard(dogId) {
  const ok = await addPhotoToDog(dogId, false);
  if (!ok) return;
  dataCache.dogs = null;
  await renderLayer();
  const fresh = findDog(dogId);
  if (fresh) openDogCard(fresh); else closeSheet();
}

// ================== ЗАСТАВКА ==================
// Ожидание всё равно есть — значит, оно должно работать на пользу. Показываем, зачем
// сюда возвращаться: половина функций мини-аппа людям просто неизвестна.
const SPLASH_TIPS = [
  ['🏷', 'tip_tag'], ['📍', 'tip_walk'], ['🚨', 'tip_lost'], ['📷', 'tip_photo'],
  ['🔔', 'tip_sub'], ['🩸', 'tip_donor'], ['🏡', 'tip_seek'], ['🧑', 'tip_sitter']
];

(function runSplash() {
  const box = document.getElementById('splashTip');
  const dots = document.getElementById('splashDots');
  if (!box || !dots) return;
  // Порядок случайный: при каждом запуске человек видит другую подсказку первой,
  // иначе после третьего открытия заставка перестаёт нести что-либо новое.
  const tips = SPLASH_TIPS.slice().sort(() => Math.random() - 0.5);
  dots.innerHTML = tips.map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('');
  let i = 0;
  const show = () => {
    const [ic, key] = tips[i];
    box.innerHTML = `<div class="ic">${ic}</div><div class="tx">${t(key)}</div>`;
    box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap');
    Array.from(dots.children).forEach((d, k) => d.classList.toggle('on', k === i));
  };
  show();
  // 6 секунд: три секунды — это ровно на одно прочтение по диагонали, а подсказка
  // должна успеть дочитаться до конца.
  window._splashTimer = setInterval(() => { i = (i + 1) % tips.length; show(); }, 6000);
})();

function hideSplash() {
  const el = document.getElementById('splash');
  if (!el || el.classList.contains('hide')) return;
  clearInterval(window._splashTimer);
  el.classList.add('hide');
  setTimeout(() => { try { el.remove(); } catch (e) {} }, 400);
}

// ================== СТАРТ ==================
// Справочники — ОДНИМ запросом. Было три последовательных: породы, районы, возрасты.
// На холодном Apps Script каждый стоит несколько сотен миллисекунд, и все три
// выполнялись до того, как человек мог что-то ввести.
(async function loadRefData() {
  try {
    const r = await fetch(`${API_URL}?type=refs&${initDataQS()}`);
    const j = await r.json();
    if (j.breeds && j.breeds.length) COMMON_BREEDS = j.breeds;
    if (j.regions && j.regions.length) REGIONS_LIST = j.regions;
    if (j.ages && j.ages.length) AGE_OPTIONS = j.ages;
  } catch (e) { /* останутся значения по умолчанию — форма работает и без справочников */ }
})();

(function initFromQuery() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get('layer') === 'lost') { activeTab = 'dogs'; subFilter = 'lost'; }
    if (params.get('layer') === 'found') { activeTab = 'dogs'; subFilter = 'found'; }
    if (params.get('screen')) showScreen(params.get('screen'));
  } catch (e) {}
})();

applyStaticI18n();   // перевести оболочку до первого рендера
renderSubfilters();
// Сначала узнаём город пользователя, ТОЛЬКО потом рисуем карту — иначе первый рендер
// проходит с me=null и показывает собак всех городов.
// Профиль и слой карты грузим ПАРАЛЛЕЛЬНО — раньше карта ждала getMe и старт был долгим.
// Профиль теперь приезжает вместе со слоем собак, одним запросом. Раньше их было
// два — getMe и слой, — и каждый будил Apps Script со своим холодным стартом:
// человек ждал две загрузки подряд там, где хватает одной.
// Отдельный getMe остаётся запасным путём: если сервер ещё старой версии или слой
// поднялся из локального кэша, профиль надо всё равно откуда-то взять.
// Город смотрящего до загрузки профиля. Раньше фильтр по городу зависел от me,
// и первая отрисовка шла со всеми городами сразу — карта моргала.
let viewerCity = null;

async function loadProfileQuietly() {
  try {
    const res = await callApi('getMe', {}, true);
    if (!applyMePayload(res)) return;
    renderSubfilters();
    renderLayer();
    if (activeScreen === 'profile') renderProfile();
  } catch (e) {}
}

function applyMePayload(res) {
  if (!res || !res.ok) return false;
  me = res;
  if (me.botUsername) BOT_USERNAME = me.botUsername;
  // Язык, выбранный в боте, важнее языка Telegram — применяем его к статике.
  if (me.profile) {
    syncLangFromProfile(me.profile);
    // Центрируем повторно, только если город в профиле отличается от того, по
    // которому карту уже показали: иначе вид дёргается на ровном месте.
    if (me.profile.city && me.profile.city !== viewerCity) centerMapByCity(me.profile.city);
    viewerCity = me.profile.city || viewerCity;
  }
  applyStaticI18n();
  return true;
}

// Старт: сначала карта и ничего больше. Профиль грузится следом, фоном — он нужен
// профилю, ситтерам и формам, но не нужен, чтобы показать собак твоего города.
// Раньше карта ждала его, а он лезет в таблицу за справочниками и счётчиками.
(async function boot() {
  try { await loadData('dogs'); } catch (e) {}
})().finally(() => {
  renderSubfilters();
  renderLayer();
  hideSplash();
  centerMapByCity(viewerCity);

  // Профиль — молча и следом. Когда приедет, перерисуем слой: фильтр «мои» и метки
  // подписок до этого момента показывались без них.
  loadProfileQuietly();
  // Предзагрузка соседних слоёв — через пять секунд и только если человек всё ещё
  // на карте. Через секунду после старта она конкурировала за сеть с фотографиями
  // карточек и выглядела второй загрузкой подряд.
  setTimeout(() => {
    if (activeScreen === 'map') prefetchLayersQuietly();
  }, 5000);
});

// Догрузка «про запас»: тянем слои, которых человек ещё не открывал, чтобы переход
// на вкладку был мгновенным. Молча — никаких индикаторов поверх карты.
async function prefetchLayersQuietly() {
  try {
    if (!dataCache.places) {
      const r = await fetch(`${API_URL}?type=places&${initDataQS()}`);
      const j = await r.json();
      if (j && j.places) { dataCache.places = j.places; writeLayerCache('places', j.places); }
    }
  } catch (e) {}
  try {
    if (!sittersCache && !readSittersCache()) {
      const box = await fetchSitters(true);
      applySittersBox(box);
    }
  } catch (e) {}
}

// Страховка: если сеть висит совсем долго, заставку всё равно убираем — пустая карта
// честнее бесконечной крутилки, да и данные могут подняться из кэша слоёв.
setTimeout(hideSplash, 15000);
</script>
</body>
