<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Love Dogs · Тбилиси</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  /* ============ ТОКЕНЫ: «эмалевая табличка и латунный жетон» ============ */
  :root {
    /* семантика (имена сохранены — используются в JS-шаблонах) */
    --paw:      #e29c33;                /* латунь: собаки, первичные действия */
    --paw-deep: #b87a1d;
    --vet:      #1f5b4b;                /* хвоя: места */
    --shop:     #1f5b4b;
    --red:      #d24b3c;                /* потеряшки, опасные действия */
    --yellow:   #d9a13b;
    --found:  #e0392b;   /* находка: красный — это срочно, как и потеряшка */
    --green:    #2e7d5b;
    --grey:     #a49a8a;

    --bg:    var(--tg-theme-bg-color, #f8f4ec);
    --text:  var(--tg-theme-text-color, #272219);
    --hint:  var(--tg-theme-hint-color, #7c7263);
    --card:  var(--tg-theme-secondary-bg-color, #ffffff);
    color-scheme: light dark;
    --btnbg: var(--paw);
    --btntx: #2b2008;
    --line:  color-mix(in srgb, var(--text) 12%, transparent);

    /* Подложки и обводки НЕ фиксируем светлыми: иначе в тёмной теме Telegram
       поверх тёмного фона появлялись кремовые пятна, а тёмный текст на тёмном
       становился нечитаемым. Выводим их из фона/текста темы — работает в обеих. */
    --surface:      color-mix(in srgb, var(--paw) 14%, var(--card));  /* мягкая фирменная подложка */
    --surface-soft: color-mix(in srgb, var(--paw) 8%, var(--card));   /* ещё тише — треки, плейсхолдеры */
    --stroke:       var(--card);                                      /* обводка маркеров = цвет карточки */
    --on-brand:     #2b2008;                                          /* текст поверх янтарной заливки */
    --shadow-s: 0 1px 2px rgba(39,34,25,.06), 0 4px 14px rgba(39,34,25,.06);
    --shadow-m: 0 2px 6px rgba(39,34,25,.10), 0 10px 30px rgba(39,34,25,.14);
    --r-card: 18px;
    --r-ctl: 13px;
    --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-disp: "Unbounded", "Manrope", sans-serif;
    --tabbar-h: calc(62px + env(safe-area-inset-bottom));
  }
  /* Тёмная тема. Telegram отдаёт свои цвета фона и текста, а фирменные подложки
     считаются от них выше. Здесь только то, что нельзя вывести автоматически:
     чуть приглушаем янтарь и делаем тени глубже — на тёмном фоне светлые тени не видны. */
  @media (prefers-color-scheme: dark) {
    :root {
      /* Запасные значения тоже должны быть тёмными. Telegram присылает themeParams не
         всегда и не сразу; пока их нет, работали светлые подстановки — отсюда белая
         вспышка заставки перед тёмным интерфейсом. */
      --bg:    var(--tg-theme-bg-color, #17181a);
      --text:  var(--tg-theme-text-color, #ececec);
      --hint:  var(--tg-theme-hint-color, #8d9096);
      --card:  var(--tg-theme-secondary-bg-color, #232427);
      --paw:      #d9973a;
      --paw-deep: #f0b968;   /* на тёмном «глубокий» оттенок должен быть СВЕТЛЕЕ базового */
      --shadow-s: 0 1px 2px rgba(0,0,0,.36), 0 4px 14px rgba(0,0,0,.30);
      --shadow-m: 0 2px 6px rgba(0,0,0,.44), 0 10px 30px rgba(0,0,0,.40);
    }
  }
  /* Telegram может явно сообщить тёмную схему — учитываем и это (класс ставится из JS). */
  body.tg-dark {
    --bg:    var(--tg-theme-bg-color, #17181a);
    --text:  var(--tg-theme-text-color, #ececec);
    --hint:  var(--tg-theme-hint-color, #8d9096);
    --card:  var(--tg-theme-secondary-bg-color, #232427);
    --paw:      #d9973a;
    --paw-deep: #f0b968;
    --shadow-s: 0 1px 2px rgba(0,0,0,.36), 0 4px 14px rgba(0,0,0,.30);
    --shadow-m: 0 2px 6px rgba(0,0,0,.44), 0 10px 30px rgba(0,0,0,.40);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 14px; line-height: 1.45; overflow: hidden;
    -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; height: 100dvh; position: relative; }
  button { font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--paw); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ================= КАРТА (главный экран) ================= */
  #map { position: absolute; inset: 0 0 var(--tabbar-h) 0; background: var(--bg); }
  #map-topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 700; padding: 10px 12px 14px;
    pointer-events: none; }
  #map-topbar > * { pointer-events: auto; }
  #tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px;
    background: rgba(248,244,236,.85);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: var(--shadow-s); border: 1px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 999px; font-size: 13px; font-weight: 700;
    color: var(--hint); transition: background .18s ease, color .18s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; user-select: none; }
  .tab.active { color: #fff; }
  .tab[data-k="dogs"].active { background: var(--paw); color: var(--btntx); }
  .tab[data-k="places"].active { background: var(--vet); }
  #subfilters { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; padding: 2px; }
  #subfilters::-webkit-scrollbar { display: none; }
  /* Зум Leaflet по умолчанию — белые квадраты с синей рамкой, чужие для этой темы.
     Приводим к тем же скруглениям, цветам и теням, что у остальных элементов. */
  .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow-s) !important;
    border-radius: 14px !important; overflow: hidden; margin-top: 116px !important; margin-left: 14px !important; }
  .leaflet-control-zoom a { width: 38px !important; height: 38px !important; line-height: 38px !important;
    background: color-mix(in srgb, var(--bg) 92%, transparent) !important;
    -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4);
    color: var(--text) !important; border: none !important;
    border-bottom: 1px solid var(--line) !important; font-size: 19px !important; font-weight: 600; }
  .leaflet-control-zoom a:last-child { border-bottom: none !important; }
  .leaflet-control-zoom a:hover { background: var(--bg) !important; }
  .leaflet-control-attribution { border-radius: 10px 0 0 0; font-size: 9px; opacity: .65; }
  .opt-mark { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 5px; }
  details.more { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.more > summary { list-style: none; cursor: pointer; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; padding: 6px 0; color: var(--text); }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: '⌄'; margin-left: auto; font-size: 18px; color: var(--muted);
    transition: transform .18s ease; }
  details.more[open] > summary::after { transform: rotate(180deg); }
  /* «Дополнить анкету» в форме новой собаки: выглядит как кнопка-строка, чтобы было
     видно, что её можно раскрыть, а не как подпись раздела. */
  details.more.tap { border-top: none; padding-top: 4px; }
  details.more.tap > summary { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-ctl);
    background: var(--card); }
  details.more.tap > summary::after { color: var(--paw-deep); font-weight: 700; }
  details.more.tap[open] > summary { border-color: var(--paw); }
  .title-sub { font-size: 13px; font-weight: 500; color: var(--muted); }
  .sw { position: relative; display: inline-block; width: 44px; height: 26px; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .2s; }
  .sw span::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: var(--shadow-s); }
  .sw input:checked + span { background: var(--vet); }
  .sw input:checked + span::before { transform: translateX(18px); }
  /* Строка профиля, которую можно править на месте. Поле выглядит как обычный текст,
     пока его не тронули: отдельное окно редактирования ради четырёх полей — лишний
     шаг, и человек не видит, что вообще можно менять. */
  .edit-row { display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .edit-row:last-child { border-bottom: 0; }
  .edit-row > span { color: var(--hint); font-size: 14px; flex: 0 0 auto; }
  .edit-row .val { flex: 1 1 auto; min-width: 0; text-align: right; }
  .edit-row input[type=text], .edit-row input[type=tel], .edit-row select {
    width: 100%; text-align: right; font-family: inherit; font-size: 15px; font-weight: 600;
    color: var(--fg); background: transparent; border: 1px solid transparent;
    border-radius: 9px; padding: 6px 8px; appearance: none; cursor: pointer; }
  .edit-row select { text-align-last: right; }
  .edit-row input:focus, .edit-row select:focus { outline: none;
    border-color: var(--paw); background: var(--bg); cursor: text; }
  .edit-row input::placeholder { color: var(--hint); font-weight: 400; }
  .edit-hint { font-size: 12px; color: var(--hint); margin-top: 8px; }
  .legend-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .legend-row { display: flex; gap: 12px; align-items: flex-start; }
  /* Слот фиксированной ширины под настоящий .marker-pin: легенда показывает ровно
     тот значок, который человек видит на карте, включая кольца и пунктир. */
  .legend-pin { flex: none; width: 46px; display: flex; align-items: center; justify-content: center;
    min-height: 40px; }
  .legend-pin .marker-pin { width: 34px; height: 34px; }
  .legend-pin .marker-pin span { font-size: 16px; }
  .legend-pin .marker-pin.lost { animation: none; }   /* в списке пульсация только отвлекает */
  .legend-pin .pack-badge { transform: scale(.8); white-space: nowrap; }
  #legendBtn { position: absolute; bottom: calc(var(--tabbar-h) + 16px); left: 14px; z-index: 750;
    width: 38px; height: 38px; padding: 0; border-radius: 50%; display: none;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4);
    border: 1px solid var(--line); color: var(--text); font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-s); cursor: pointer; }
  #legendBtn.show { display: flex; }
  .chip { white-space: nowrap; font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: rgba(248,244,236,.88);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px) saturate(1.4); -webkit-backdrop-filter: blur(10px) saturate(1.4);
    color: var(--hint); cursor: pointer; user-select: none; border: 1px solid var(--line);
    transition: background .15s ease, color .15s ease; }
  /* «Выбрано» во всём приложении — фирменный акцент, а не чёрный. Раньше вкладка
     сверху подсвечивалась охрой, а фильтр под ней — чёрным: два разных цвета для
     одного и того же смысла. Оттенок наследуется от активного слоя (собаки — охра,
     места — хвоя), так что цвет заодно говорит, на что смотришь. */
  .chip.active { background: var(--accent, var(--paw)); color: #fff; border-color: transparent; }
  body[data-layer="dogs"] .chip.active { background: var(--paw); color: var(--btntx); }
  body[data-layer="places"] .chip.active { background: var(--vet); color: #fff; }
  #status { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); z-index: 750;
    background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 8px 16px;
    border-radius: 999px; box-shadow: var(--shadow-m); pointer-events: none; opacity: 0;
    transition: opacity .2s ease; max-width: 86%; text-align: center; }
  #status.show { opacity: 1; }
  #count-badge { position: absolute; bottom: calc(var(--tabbar-h) + 16px); left: 60px; z-index: 750;
    cursor: pointer;
    background: rgba(248,244,236,.9);
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px) saturate(1.4);
    -webkit-backdrop-filter: blur(10px) saturate(1.4); color: var(--text); font-size: 12px; font-weight: 700;
    letter-spacing: .01em; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
    box-shadow: var(--shadow-s); }
  /* Кнопка добавления: раньше это был безымянный «+» в углу, который легко принять
     за элемент карты. Теперь — подпись, ощутимый размер и мягкое «дыхание» первые
     секунды после загрузки, чтобы её заметили, но она не мельтешила постоянно. */
  #fab { position: absolute; bottom: calc(var(--tabbar-h) + 16px); right: 14px; z-index: 750;
    /* Главное действие экрана красим акцентом, а не вторым зелёным: раньше кнопка,
       кластеры и маркеры мест были тремя разными цветами и спорили за внимание. */
    height: 52px; padding: 0 20px 0 16px; border-radius: 26px; background: var(--paw); color: var(--btntx);
    border: none; font-size: 15px; font-weight: 700; letter-spacing: .01em;
    box-shadow: 0 6px 20px rgba(0,0,0,.22), 0 2px 8px rgba(226,156,51,.35); cursor: pointer; display: none;
    align-items: center; gap: 8px; transition: transform .12s ease, box-shadow .2s ease; }
  #fab .fab-plus { font-size: 22px; font-weight: 400; line-height: 1; margin-top: -2px; }
  #fab:active { transform: scale(.94); }
  /* Индикатор занятости — три «дышащие» точки поверх затемнения. Без него длинная
     операция выглядит как зависание, и человек жмёт кнопку второй раз. */
  #busy { position: fixed; inset: 0; z-index: 2000; display: none;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  #busy.show { display: flex; }
  .busy-dots { display: flex; gap: 7px; padding: 16px 20px; border-radius: 18px;
    background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow-m); }
  .busy-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--vet);
    animation: busyBounce 1s ease-in-out infinite; }
  .busy-dots i:nth-child(2) { animation-delay: .15s; }
  .busy-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes busyBounce { 0%,80%,100% { transform: translateY(0); opacity: .45; }
                          40% { transform: translateY(-7px); opacity: 1; } }
  #fab.show { animation: fabIn .45s ease both, fabPulse 2.4s ease-in-out 1.2s 2; }
  @keyframes fabIn { from { opacity: 0; transform: translateY(12px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes fabPulse { 0%,100% { box-shadow: 0 6px 20px rgba(0,0,0,.22), 0 2px 8px rgba(226,156,51,.35); }
                        50% { box-shadow: 0 6px 28px rgba(0,0,0,.28), 0 0 0 10px color-mix(in srgb, var(--vet) 14%, transparent); } }
  #fab.show { display: flex; }

  /* Маркеры-«жетоны»: эмалевый кружок с латунным ободком */
  /* Подложку попапа красим переменными темы: у Leaflet по умолчанию белый фон,
     и в тёмной теме Telegram светлый --text становился невидимым */
  .leaflet-popup-content-wrapper { border-radius: 16px; box-shadow: var(--shadow-m);
    background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .leaflet-popup-tip { background: var(--card); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--hint); }
  .leaflet-popup-content { margin: 13px 15px; font-size: 13.5px; line-height: 1.45; width: 240px !important;
    font-family: var(--font-body); color: var(--text); }
  .leaflet-popup-content .pop-title { color: var(--text); }
  .leaflet-bar a { background: var(--card) !important; color: var(--text) !important;
    border-color: var(--line) !important; }
  /* Размер подобран так, чтобы значок читался на ходу и попадал под палец:
     30 px были едва различимы, особенно на плотной карте центра. */
  .marker-pin { width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2.5px solid var(--stroke); box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.22); }
  .marker-pin span { font-size: 18px; }
  .marker-pin::before { content: ""; position: absolute; inset: 2px; border-radius: 50%;
    background: linear-gradient(155deg, rgba(255,255,255,.35), transparent 55%);
    pointer-events: none; }
  .marker-pin.lost { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(210,75,60,.5);} 70% { box-shadow: 0 0 0 13px rgba(210,75,60,0);} 100% { box-shadow: 0 0 0 0 rgba(210,75,60,0);} }
  .marker-pin.closed { opacity: .45; }
  .marker-pin.moderation { border-style: dashed; border-color: #E0A93B; }
  /* «Моя собака»: кольцо + сердечко-бейдж. Одного кольца оказалось мало — раньше
     свои собаки читались как обычные домашние (иконка статуса у них одинаковая). */
  .marker-pin.mine { border-color: var(--paw-deep); border-width: 3px; }
  .marker-pin.mine::after { content: "💛"; position: absolute; right: -5px; bottom: -4px;
    font-size: 12px; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .marker-pin { position: relative; }
  /* Уличная с устаревшей гео (>3 мес без подтверждений): приглушённая и с пунктирным
     кольцом — читается как «не подтверждено», но не спорит с алармом потеряшки. */
  /* «Ищет дом»: зелёная заливка + мягкое свечение. Метка должна цеплять взгляд на
     карте, но не спорить с красной пульсацией потеряшки — там срочность выше. */
  .marker-pin.found { box-shadow: 0 0 0 3px color-mix(in srgb, var(--found) 45%, transparent), var(--shadow-m); }
  .marker-pin.seeking { border-color: #fff; border-width: 3px;
    box-shadow: 0 0 0 3px rgba(46,160,90,.28), 0 2px 6px rgba(0,0,0,.25); }
  .marker-pin.stale { border-style: dashed; opacity: .6; }
  .marker-pin.stale span { opacity: .75; }

  /* Режим выбора точки */
  #pick-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 800;
    font-size: 36px; pointer-events: none; display: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  #pick-bar { position: absolute; left: 14px; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px);
    z-index: 800; background: var(--card); border-radius: var(--r-card); padding: 14px;
    box-shadow: var(--shadow-m); display: none; border: 1px solid var(--line); }
  #pick-bar .pick-hint { font-size: 12.5px; color: var(--hint); margin-bottom: 10px; text-align: center; }
  #pick-bar .row { display: flex; gap: 8px; }
  body.picking #pick-pin, body.picking #pick-bar { display: block; }
  body.picking #map-topbar, body.picking #fab, body.picking #legendBtn, body.picking #count-badge, body.picking #tabbar { display: none; }
  body:not([data-screen="map"]) #count-badge { display: none; }
  body.picking #map { inset: 0; }

  /* Хром карты — только на экране карты */
  body:not([data-screen="map"]) #map-topbar,
  body:not([data-screen="map"]) #count-badge,
  body:not([data-screen="map"]) .leaflet-control-container,
  body:not([data-screen="map"]) #fab,
  body:not([data-screen="map"]) #status { display: none !important; }

  /* ================= ЭКРАНЫ-СПИСКИ ================= */
  .screen { position: absolute; inset: 0 0 var(--tabbar-h) 0; background: var(--bg); z-index: 650;
    overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; padding: 18px 16px 28px; }
  .screen.show { display: block; }
  .screen h2 { font-family: var(--font-disp); font-size: 19px; font-weight: 600; letter-spacing: -.01em;
    margin: 2px 0 14px; }
  .sec-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--hint); margin: 22px 0 9px; }
  .card { background: var(--card); border-radius: var(--r-card); padding: 14px 15px; margin-bottom: 10px;
    border: 1px solid var(--line); box-shadow: var(--shadow-s); }
  .card.tappable { cursor: pointer; transition: transform .1s ease; }
  /* Удаление комментария — служебное действие, а не тревожное: нейтральная кнопка
     вместо красной. Красный в интерфейсе оставляем за потеряшками. */
  .star-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .star-btn { flex: 1 1 calc(33% - 8px); min-width: 84px; padding: 10px 6px; border: 0;
    border-radius: var(--r-card); background: var(--surface); color: var(--fg);
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .1s ease; }
  .star-btn:active { transform: scale(.96); }
  /* Заставка первого запуска. Apps Script на холодную отвечает секундами, и всё это
     время человек смотрел на серый прямоугольник и не понимал, сломалось ли что-то.
     Показываем, что происходит, и заодно рассказываем, зачем сюда возвращаться. */
  #splash { position: fixed; inset: 0; z-index: 2000; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 24px; text-align: center; transition: opacity .35s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash .paw { font-size: 44px; animation: splashPaw 1.4s ease-in-out infinite; }
  @keyframes splashPaw { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
  #splash .sp-title { font-family: var(--font-disp); font-size: 19px; font-weight: 600;
    margin: 14px 0 22px; letter-spacing: -.01em; }
  #splash .sp-tip { min-height: 92px; max-width: 320px; display: flex; flex-direction: column;
    justify-content: center; gap: 8px; }
  #splash .sp-tip .ic { font-size: 26px; }
  #splash .sp-tip .tx { font-size: 14px; line-height: 1.5; color: var(--hint); }
  #splash .sp-tip.swap { animation: tipIn .4s ease; }
  @keyframes tipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #splash .sp-dots { display: flex; gap: 6px; margin-top: 24px; }
  #splash .sp-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .3s; }
  #splash .sp-dots i.on { background: var(--paw-deep); }
  /* Поле выбора снимка: сразу показывает, что выбрано, — иначе непонятно, случилось
     ли что-нибудь после возни с системным выбором файла. */
  .photo-pick { width: 100%; aspect-ratio: 4 / 3; max-height: 200px; border-radius: var(--r-ctl, 14px);
    border: 1px dashed var(--line); background: var(--surface) center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; position: relative; overflow: hidden; }
  .photo-pick .ic { font-size: 30px; }
  .photo-pick .tx { font-size: 13px; color: var(--hint); }
  .photo-pick.has { border-style: solid; }
  .photo-pick .rep { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.62);
    color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; }
  .row-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sub-ava { width: 40px; height: 40px; border-radius: 10px; flex: 0 0 40px; background: var(--card);
             background-size: cover; background-position: center; display: flex; align-items: center;
             justify-content: center; font-size: 18px; }
  .cm-del { background: none; border: 0; padding: 2px 6px; font-size: 14px; line-height: 1;
            color: var(--hint); opacity: .6; cursor: pointer; border-radius: 6px; }
  .cm-del:active { opacity: 1; background: var(--card); }
  .card.tappable:active { transform: scale(.985); }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .list-title { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .list-sub { font-size: 12.5px; color: var(--hint); margin-top: 3px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: rgba(39,34,25,.07);
    background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
  .badge.warn { background: rgba(210,75,60,.14);
    background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .badge.ok { background: rgba(46,125,91,.14);
    background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .badge.brand { background: var(--surface); color: var(--paw-deep); }
  .pop-badges, .badges { margin-top: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--hint); font-size: 13.5px; padding: 34px 12px; }
  .empty .big { font-size: 38px; margin-bottom: 10px; }

  .searchbox { display: flex; align-items: center; gap: 9px; background: var(--card); border-radius: var(--r-ctl);
    padding: 11px 13px; margin-bottom: 10px; border: 1px solid var(--line); }
  .searchbox input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 14px;
    font-family: var(--font-body); outline: none; }
  .searchbox input::placeholder { color: var(--hint); }
  .seg-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin-bottom: 6px; }
  .seg-scroll::-webkit-scrollbar { display: none; }
  .seg-scroll .chip { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .seg-scroll .chip.active { background: var(--paw); color: var(--btntx); }

  .pop-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .pop-row { color: var(--hint); font-size: 13px; }
  .pop-row a { color: var(--vet); font-weight: 600; }

  /* Кнопки */
  .pop-btn { border: none; border-radius: var(--r-ctl); padding: 12px 12px; font-size: 13.5px; font-weight: 800;
    letter-spacing: .01em; background: var(--btnbg); color: var(--btntx); cursor: pointer; width: 100%;
    transition: transform .1s ease, filter .15s ease; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
  .pop-btn:active { transform: scale(.98); filter: brightness(.96); }
  .pop-btn.secondary { background: rgba(39,34,25,.07);
    background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
  .pop-btn.danger { background: var(--red); color: #fff; }
  .pop-btn.small { width: auto; padding: 9px 13px; font-size: 12.5px; }
  .pop-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  /* Кнопки переносятся на новую строку: у ситтера с телефоном их четыре, и в одну
     строку они уезжали за край экрана. */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row .pop-btn { flex: 1 1 calc(50% - 4px); min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  .stars { cursor: pointer; font-size: 30px; line-height: 1; user-select: none;
    display: flex; gap: 6px; justify-content: center; padding: 6px 0; flex-wrap: nowrap; max-width: 100%; }
  .stars .star { transition: transform .1s ease; flex: 0 0 auto; }
  .stars .star:active { transform: scale(1.3); }
  .stars-small { font-size: 12.5px; }
  .pack-marker { background: none; border: none; }
  .pack-badge { background: var(--street, #6b7280); color: #fff; font-weight: 700; font-size: 12px;
    padding: 5px 10px; border-radius: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    border: 2px solid var(--stroke); text-align: center; }
  /* Значок кластера маркеров (число слипшихся меток) */
  .cluster-marker { background: transparent; }
  .cluster-badge { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    /* Кластер — не действие, а служебная разметка карты: сколько точек скрыто под одной.
       Нейтральный тон, чтобы не конкурировать с кнопкой и с самими маркерами. */
    background: color-mix(in srgb, var(--text) 78%, var(--bg)); color: var(--bg);
    font-weight: 800; font-size: 13px;
    border-radius: 50%; border: 2px solid var(--stroke); box-shadow: 0 2px 8px rgba(0,0,0,.3); }

  /* донорские фильтры */
  #donor-panel { background: var(--card); border-radius: var(--r-card); padding: 13px 14px; margin-bottom: 10px;
    display: none; border: 1px solid var(--line); }
  #donor-panel.show { display: block; }
  #donor-panel .fline { display: flex; align-items: center; justify-content: space-between; padding: 7px 0;
    font-size: 13.5px; font-weight: 600; }
  input[type="range"] { width: 55%; accent-color: var(--paw); }
  .switch { position: relative; width: 44px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-t { position: absolute; inset: 0; background: rgba(39,34,25,.2);
    background: color-mix(in srgb, var(--text) 18%, transparent);
    border-radius: 999px; transition: background .15s; }
  .slider-t:before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: var(--card); border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .slider-t { background: var(--paw); }
  .switch input:checked + .slider-t:before { transform: translateX(18px); }

  /* профиль */
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: var(--surface);
    border: 2px solid color-mix(in srgb, var(--paw) 45%, transparent);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex: 0 0 auto; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line);
    font-size: 13.5px; gap: 12px; }
  .info-row:last-child { border-bottom: none; }
  .info-row span { color: var(--hint); flex-shrink: 0; }
  .info-row b { text-align: right; word-break: break-word; font-weight: 700; }

  /* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
  #tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tabbar-h); z-index: 900;
    background: rgba(248,244,236,.92);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  /* Навигация без подписей: иконки самодостаточны, а подписи съедали высоту
     и мешали на маленьких экранах. Активный пункт выделяем «таблеткой».
     Таблетка — фон самой иконки, а не псевдоэлемент с z-index:-1: тот уезжал
     ЗА полупрозрачный фон таббара и на части устройств не появлялся вовсе,
     из-за чего активный пункт выглядел никак не выделенным. */
  .nav-item { flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--hint); cursor: pointer; user-select: none; position: relative;
    height: 100%; transition: color .15s ease; -webkit-tap-highlight-color: transparent; }
  .nav-item .ico { font-size: 21px; line-height: 1; width: 48px; height: 34px;
    border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: transparent; transition: background .18s ease, transform .18s ease;
    filter: saturate(.25) opacity(.7); }
  .nav-item.active { color: var(--paw-deep); }
  .nav-item.active .ico { background: var(--surface); filter: none; transform: scale(1.04); }
  .nav-item:active .ico { transform: scale(.92); }
  .nav-dot { position: absolute; top: 12px; right: calc(50% - 16px); width: 8px; height: 8px;
    border-radius: 50%; background: var(--red); display: none; border: 1.5px solid var(--bg); }
  .nav-dot.show { display: block; }

  /* ================= НИЖНИЙ ЛИСТ: «паспорт двора» ================= */
  #sheet-overlay { position: fixed; inset: 0; background: rgba(30,25,17,.42); z-index: 1000; display: none; }
  #sheet-overlay.show { display: block; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-radius: 22px 22px 0 0; z-index: 1001;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .24s cubic-bezier(.32,.72,.33,1);
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 -8px 40px rgba(30,25,17,.25); }
  #sheet.show { transform: translateY(0); }
  #sheet:before { content: ""; display: block; width: 40px; height: 4px; border-radius: 999px;
    background: rgba(39,34,25,.24);
    background: color-mix(in srgb, var(--text) 22%, transparent); margin: 2px auto 14px; }
  #sheet h3 { font-family: var(--font-disp); font-size: 16px; font-weight: 600; letter-spacing: -.01em;
    margin: 0 0 14px; }
  .field { margin-bottom: 11px; }
  .field label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--hint); display: block; margin-bottom: 5px; }
  .field input[type=text], .field input[type=tel], .field input[type=number], .field textarea, .field select {
    width: 100%; padding: 11px 12px; border-radius: var(--r-ctl); border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 14px; font-family: var(--font-body);
    appearance: none; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--paw); box-shadow: 0 0 0 3px color-mix(in srgb, var(--paw) 22%, transparent); }
  .field textarea { resize: vertical; min-height: 64px; }
  .char-count { font-size: 11.5px; color: var(--hint); text-align: right; margin-top: 3px; }
  /* --- Дашборд админа --- */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 9px; text-align: center; }
  .kpi .val { font-family: var(--font-disp); font-size: 21px; font-weight: 800; color: var(--paw-deep); line-height: 1.1; }
  .kpi .lbl { font-size: 10.5px; color: var(--hint); margin-top: 3px; line-height: 1.25; }
  .kpi.wide { grid-column: span 3; }
  .kpi.good .val { color: var(--green); } .kpi.warn .val { color: var(--red); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12.5px; }
  .bar-row .nm { width: 96px; color: var(--hint); flex: 0 0 auto; }
  .bar-track { flex: 1; height: 9px; background: var(--surface-soft); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--paw); border-radius: 999px; }
  .bar-row .cnt { width: 34px; text-align: right; font-weight: 700; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin-top: 8px; }
  .spark div { flex: 1; background: var(--paw); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85; }
  .spark div.today { background: var(--paw-deep); opacity: 1; }
  .spark-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--hint); margin-top: 4px; }
  .char-count.over { color: var(--red); font-weight: 700; }
  .field-row { display: flex; align-items: center; gap: 8px; }
  .pop-actions.vertical { display: flex; flex-direction: column; gap: 8px; }

  /* Шапка карточки собаки — латунный жетон с пробитым отверстием и перфорацией */
  .dog-card-head { display: flex; align-items: center; gap: 13px; margin: 0 -18px 12px;
    padding: 14px 18px 16px;
    background: radial-gradient(120% 65% at 18% -10%, rgba(255,255,255,.30), transparent 60%), linear-gradient(160deg, #eeb04a, var(--paw) 55%, var(--paw-deep));
    position: relative; }
  /* Вертикальная «геройская» раскладка — только для карточки собаки; тот же класс
     используется в шапке профиля пользователя, где нужен обычный ряд аватар+текст. */
  .dog-card-head.hero { flex-direction: column; align-items: center; gap: 11px; padding: 16px 18px 18px; }
  .dog-card-head::before { content: ""; position: absolute; top: 12px; right: 16px; width: 13px; height: 13px;
    border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgba(0,0,0,.28); }
  .dog-card-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 0;
    border-bottom: 2px dashed color-mix(in srgb, var(--paw-deep) 55%, transparent); }
  .dog-card-head h3 { margin: 0; color: var(--on-brand); font-family: var(--font-disp); font-size: 17px; }
  .dog-card-head.hero h3 { font-size: 19px; text-align: center; }
  /* Фото — главный элемент карточки. Квадрат во всю ширину съедал почти весь экран,
     и до анкеты приходилось листать. Формат 4:3 и рамка в 1px вместо 3px отдают место
     содержанию; кличка переехала плашкой на само фото и больше не занимает строку. */
  .dog-photo { width: 100%; aspect-ratio: 4 / 3; max-height: 46vh; border-radius: var(--r-ctl, 14px);
    background: var(--surface) center/cover no-repeat;
    border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.14);
    display: flex; align-items: center; justify-content: center; font-size: 60px; flex: 0 0 auto;
    cursor: pointer; position: relative; overflow: hidden; }
  .dog-photo.loaded { font-size: 0; }
  /* Пока картинка едет — мягкое мерцание вместо затемнения всего экрана. */
  .dog-photo.loading::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.14) 50%, transparent 80%);
    animation: photoShine 1.1s linear infinite; }
  .dog-photo.loaded.loading::after { display: none; }
  @keyframes photoShine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  /* Кличка поверх фото: градиент снизу, чтобы текст читался на любом снимке. */
  .dog-photo .name-plate { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 12px 10px;
    font-family: var(--font-disp); font-size: 19px; font-weight: 600; color: #fff; text-align: left;
    letter-spacing: -.01em; text-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none;
    background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .photo-count { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,.62); color: #fff;
    font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 12px; pointer-events: none; }
  .more-toggle { background: none; border: none; color: var(--vet, #1f5b4b); font-weight: 700; font-size: 13px; padding: 7px 0; cursor: pointer; }
  .comments-block { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .comments-title { font-family: var(--font-disp); font-weight: 600; font-size: 16px;
    letter-spacing: -.01em; margin-bottom: 10px; }
  .comments-inline .review-item { margin-bottom: 8px; }
  /* Поле для комментария выглядело как служебная подпись: мелкий шрифт, бледная
     рамка, ничем не выделенный блок. Люди его просто не замечали. Теперь это
     заметная карточка с приглашением написать. */
  .comment-compose { display: flex; flex-direction: column; gap: 10px; margin-top: 14px;
    background: var(--card); border-radius: var(--r-card); padding: 12px; }
  .comment-compose textarea { width: 100%; min-height: 76px; font-size: 15px; line-height: 1.45;
    padding: 11px 12px; border-radius: var(--r-ctl, 12px); border: 1.5px solid var(--line);
    background: var(--bg); color: var(--fg); font-family: inherit; resize: vertical; }
  .comment-compose textarea:focus { outline: none; border-color: var(--paw-deep); }
  .comment-compose textarea::placeholder { color: var(--hint); font-size: 14px; }
  .comment-compose .cm-invite { font-size: 13px; color: var(--hint); line-height: 1.4; }
  .hint-p { color: var(--hint); font-size: 13px; margin: 0 0 10px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 9999; display: none; align-items: center; justify-content: center; }

let PHOTO_BASE = '';
try { PHOTO_BASE = localStorage.getItem('photoBase') || ''; } catch (e) {}
function notePhotoBase(base) {
  if (!base || base === PHOTO_BASE) return;

  var h = (hex || '').replace('#', '');

function langFromTg(code) {
  const c = (code || '').toLowerCase();
  if (c.startsWith('ru')) return 'RU';
  if (c.startsWith('ka') || c.startsWith('ge')) return 'GE';
  return c ? 'EN' : 'RU';
}
let LANG = langFromTg(tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.language_code : '');
function t(key) {
  const d = I18N[LANG] || I18N.RU;
  return d[key] !== undefined ? d[key] : (I18N.RU[key] !== undefined ? I18N.RU[key] : key);
}
// Переводит статичную разметку: элементы помечены data-i18n="ключ".
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  // Иконочная навигация без подписей — переводим доступное имя, а не видимый текст
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = t(el.getAttribute('data-i18n-title'));
    el.setAttribute('title', v); el.setAttribute('aria-label', v);
  });
  document.documentElement.setAttribute('lang', LANG.toLowerCase());
}
// Вызывается после загрузки профиля: сохранённый в боте язык важнее языка Telegram.
function syncLangFromProfile(p) {
  if (p && p.lang && I18N[p.lang] && p.lang !== LANG) { LANG = p.lang; applyStaticI18n(); return true; }
  return false;
}

function centerMapByCity(city) {

// ---- Подложка карты ----
// Сейчас используется внутренний тайловый адрес Google (mt0..3.google.com/vt). Он
// отдаёт подписи по-русски, что для Тбилиси важно, но обращаться к нему напрямую,
// без Maps Tiles API и ключа, условиями Google не разрешено. Это не косметика:
// адрес могут закрыть в любой момент, и карта просто исчезнет.
//
// Переключатель ниже — чтобы смена источника была решением на одну строку.
// 'google'  — как сейчас: русские подписи, но вне условий использования.
// 'carto'   — CARTO поверх OpenStreetMap: легально (нужна атрибуция), приглушённая
//             подложка, сама подстраивается под тему. Подписи — грузинские/латиница.
const MAP_TILES = 'google';

const TILE_SOURCES = {
  google: {
    url: 'https://mt{s}.google.com/vt/lyrs=m&hl=ru&x={x}&y={y}&z={z}',
    opts: { maxZoom: 20, subdomains: ['0', '1', '2', '3'] }
  },
  carto: {
    url: 'https://{s}.basemaps.cartocdn.com/rastertiles/{style}/{z}/{x}/{y}{r}.png',
    opts: {
      maxZoom: 20, subdomains: 'abcd',
      attribution: '© OpenStreetMap · © CARTO'
    }
  }
};

(function addBaseTiles() {
  const src = TILE_SOURCES[MAP_TILES] || TILE_SOURCES.google;
  let url = src.url;
  if (MAP_TILES === 'carto') {
    // Подложка следует за темой Telegram: светлая карта под тёмным интерфейсом
    // выглядит как чужая вставка.
    const dark = document.body.classList.contains('tg-dark') ||
                 window.matchMedia('(prefers-color-scheme: dark)').matches;
    url = url.replace('{style}', dark ? 'dark_all' : 'light_all');
  }
  L.tileLayer(url, src.opts).addTo(map);
})();

// Нормализация номера бирки: верхний регистр, только буквы/цифры,
// кириллические омоглифы → латиница (А=A, В=B, Е=E, К=K, М=M, Н=H, О=O, Р=P, С=C, Т=T, У=Y, Х=X)
const TAG_HOMOGLYPHS = { 'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','У':'Y','Х':'X' };
function normalizeTag(s) {
  s = (s ?? '').toString().toUpperCase();
  let out = '';
  for (const chRaw of s) {
    const ch = TAG_HOMOGLYPHS[chRaw] || chRaw;
    if (/[A-Z0-9\u0400-\u04FF\u10A0-\u10FF]/.test(ch)) out += ch;
  }
  return out;
}
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function escapeHtml(s) { return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
// Глобальный индикатор занятости: любая операция, которая ходит на сервер, может
// длиться секунды — без визуального отклика экран выглядит зависшим, и человек
// жмёт кнопку повторно (именно так появлялись дубли анкет).
let _busyDepth = 0;
function setBusy(on) {
  _busyDepth = Math.max(0, _busyDepth + (on ? 1 : -1));
  const el = document.getElementById('busy');
  if (el) el.classList.toggle('show', _busyDepth > 0);
}
function setStatus(text, ms) {
  const el = document.getElementById('status');
  if (!text) { el.classList.remove('show'); return; }
  el.textContent = text; el.classList.add('show');
  if (ms) setTimeout(() => el.classList.remove('show'), ms);
}

function ratingColor(r) {
  if (r == null) return cssVar('--grey');
  if (r < 3) return cssVar('--red');
  if (r <= 4) return cssVar('--yellow');
  return cssVar('--green');
}
function pinIcon(kind, item) {
  // Маркер-«жетон»: эмалевый кружок; потеряшки — сигнальный с пульсом.
  // Три независимых сигнала теперь не конкурируют за один и тот же слот:
  //  • статус (домашняя/у опекуна/уличная) — иконка внутри кружка (🏠/🤝/🐕);
  //  • «моя собака» — контрастная рамка (было слито с цветом заливки и отдельным
  //    эмодзи 💛, но тот эмодзи-слот теперь занят статусом);
  //  • потеряшка — красный цвет + пульсация, перекрывает всё остальное.
  let cls = 'marker-pin', color, emoji;
  if (kind === 'dogs') {
    color = cssVar('--paw');
    if (item.mine) cls += ' mine';
    if (item.geoStale) cls += ' stale'; // >3 мес без подтверждения — визуально приглушаем
    if (item.lost) { cls += ' lost'; color = cssVar('--red'); emoji = DOG_ICONS.lost; }
    // «Ищет дом» важнее статуса: это призыв к действию, а статус у таких собак всегда
    // уличный. Потеряшка всё равно перекрывает — там счёт идёт на часы.
    // Находка стоит сразу после потеряшки: это тоже срочно, но смысл другой —
    // не «ищите собаку», а «узнайте свою». Поэтому отдельный цвет, а не красный.
    else if (item.status === 'Найдена') { cls += ' found'; color = cssVar('--found'); emoji = DOG_ICONS.found; }
    else if (item.seekingHome) { cls += ' seeking'; color = cssVar('--green'); emoji = DOG_ICONS.seeking; }
    else emoji = item.status === 'У владельца' ? DOG_ICONS.home : DOG_ICONS.street;
  } else {
    color = ratingColor(item.rating);
    if (item.closed) cls += ' closed';
    if (item.onModeration) cls += ' moderation';
    emoji = (PLACE_TYPES[item.type] || PLACE_TYPES.Other).icon;
  }
  // Размер обязан совпадать с CSS .marker-pin (38px). Было объявлено 30 при
  // фактических 38: Leaflet ставит ЛЕВЫЙ ВЕРХНИЙ угол в точку минус якорь, поэтому
  // центр кружка оказывался на четыре пикселя южнее и правее настоящей точки.
  // На глаз это и есть «метка встала криво» — причём у всех меток сразу.
  return L.divIcon({ className: '', html: `<div class="${cls}" style="background:${color}"><span>${emoji}</span></div>`,
    iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -22] });
}

// Подписи фильтров — ключи словаря: подставляются на каждом рендере, поэтому

};
function renderSubfilters() {
  // Активный слой пишем на <body>: от него CSS берёт цвет выделения фильтров, чтобы

    chip.onclick = () => { subFilter = k; renderSubfilters(); renderLayer(); };

// ==========================================================
// КЭШ СЛОЁВ КАРТЫ
// Apps Script на холодную отвечает секундами, и всё это время человек смотрит на
// пустую карту. Данные при этом почти не меняются между открытиями. Поэтому:
// отрисовываем сразу из локального кэша, а свежие данные подтягиваем фоном и
// перерисовываем, если они отличаются. Кэш живёт сутки, но «свежим» считается 5 минут —
// после этого фоновое обновление идёт всегда.
// ==========================================================
const LAYER_CACHE_TTL = 24 * 60 * 60 * 1000;   // сколько вообще храним
const LAYER_FRESH_MS = 15 * 60 * 1000;         // сколько считаем актуальным без обновления

function layerCacheKey(kind) { return 'ld_layer_' + kind + '_' + (MY_UID || 'anon'); }
function readLayerCache(kind) {
  try {
    const raw = localStorage.getItem(layerCacheKey(kind));
    if (!raw) return null;
    const box = JSON.parse(raw);
    if (!box || !box.t || Date.now() - box.t > LAYER_CACHE_TTL) return null;
    return box;
  } catch (e) { return null; }   // приватный режим или переполнение — просто работаем без кэша
}
function writeLayerCache(kind, data) {
  try { localStorage.setItem(layerCacheKey(kind), JSON.stringify({ t: Date.now(), d: data })); }
  catch (e) { /* квота кончилась — не беда, это всего лишь ускорение */ }
}

async function fetchLayer(kind) {
  const uid = (kind === 'dogs' && MY_UID) ? MY_UID : '';
  const res = await fetch(`${API_URL}?type=${kind}${uid ? '&uid=' + uid : ''}&${initDataQS()}`);
  const json = await res.json();
  if (json && json.photoBase) notePhotoBase(json.photoBase);
  // Профиль приложен к слою собак — берём его здесь, чтобы не ходить за ним отдельно.
  // Карта присылает только город и язык смотрящего — этого достаточно, чтобы
  // отрисовать слой и центрировать вид. Профиль целиком приезжает следом, фоном.
  if (json && json.viewerCity) viewerCity = json.viewerCity;
  if (json && json.viewerLang && !me) syncLangFromProfile({ lang: json.viewerLang });
  return json[kind] || [];
}

async function loadData(kind, force) {
  if (dataCache[kind] && !force) return dataCache[kind];

  const cached = force ? null : readLayerCache(kind);
  if (cached) {
    dataCache[kind] = cached.d;
    // Данные свежие — показываем и ничего не ждём.
    if (Date.now() - cached.t < LAYER_FRESH_MS) return dataCache[kind];
    // Данные постарше: отдаём их немедленно, а обновление идёт фоном — без «часиков»,
    // потому что человеку уже есть на что смотреть.
    // Обновление откладываем: сразу после старта карта только что отрисовалась, и
    // вторая перерисовка через секунду читается как «грузится ещё раз». Данные
    // максимум пятиминутной давности — подождать три секунды им нечем повредить.
    setTimeout(() => {
      fetchLayer(kind).then(fresh => {
        if (!fresh || !fresh.length) return;
        const changed = JSON.stringify(fresh) !== JSON.stringify(dataCache[kind]);
        dataCache[kind] = fresh;
        writeLayerCache(kind, fresh);
        if (changed) { try { renderLayer(); } catch (e) {} }
      }).catch(() => {});
    }, 3000);
    return dataCache[kind];
  }

  setStatus('Загружаю…');
  try {
    setBusy(true);
    dataCache[kind] = await fetchLayer(kind);
    writeLayerCache(kind, dataCache[kind]);
    setStatus(null);
  } catch (err) {
    // Сеть отвалилась — лучше показать вчерашние данные, чем пустой экран.
    const stale = readLayerCache(kind);
    dataCache[kind] = stale ? stale.d : [];
    setStatus(stale ? t('er_nonet') : t('er_load'), 3000);
  } finally { setBusy(false); }
  return dataCache[kind];
}

function filterDogsMap(list) {
  const myCity = (me && me.profile ? me.profile.city : null) || viewerCity;
  if (myCity) list = list.filter(d => !d.city || d.city === myCity); // только мой город
  if (subFilter === 'mine') return list.filter(d => d.mine);
  if (subFilter === 'home') return list.filter(d => d.status === 'У владельца');
  if (subFilter === 'street') return list.filter(d => d.status === 'Уличная');
  if (subFilter === 'lost') return list.filter(d => d.lost);
  if (subFilter === 'found') return list.filter(d => d.status === 'Найдена');
  if (subFilter === 'seeking') return list.filter(d => d.seekingHome);
  return list;
}
function filterPlacesMap(list) {
  const myCity = me && me.profile ? me.profile.city : null;
  let out = myCity ? list.filter(p => !p.city || p.city === myCity) : list; // только мой город
  if (subFilter !== 'all') out = out.filter(p => (p.type || 'Other') === subFilter);
  return out;
}

// Расстояние между точками в метрах (гаверсинус)
function distMeters(a, b) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Группируем уличных собак в стаи: 3+ в радиусе 50 м → один маркер «Стая (n)»
function clusterStreetDogs(list) {
  const PACK_RADIUS = 50, PACK_MIN = 3;
  const street = list.filter(d => d.status === 'Уличная' && !d.lost && d.lat && d.lng);
  const rest = list.filter(d => !(d.status === 'Уличная' && !d.lost && d.lat && d.lng));
  const used = new Array(street.length).fill(false);
  const packs = [], singles = [];
  for (let i = 0; i < street.length; i++) {
    if (used[i]) continue;
    const group = [street[i]]; used[i] = true;
    for (let j = i + 1; j < street.length; j++) {
      if (used[j]) continue;
      if (distMeters([street[i].lat, street[i].lng], [street[j].lat, street[j].lng]) <= PACK_RADIUS) { group.push(street[j]); used[j] = true; }
    }
    if (group.length >= PACK_MIN) packs.push(group); else group.forEach(d => singles.push(d));
  }
  return { packs, singles: singles.concat(rest) };
}

// Подписанный initData подставляем и в GET-запросы: сервер по нему понимает, кто
// спрашивает (флаг «моя собака», точные координаты своих собак), а в строгом режиме
// без него данные не отдаёт вовсе.
function initDataQS() { return 'initData=' + encodeURIComponent(tg ? (tg.initData || '') : ''); }

// Основной путь: сервер присылает ключ объекта в Storage, ссылка склеивается на
// месте и картинку тянет сам браузер — параллельно, с обычным HTTP-кэшем, мимо
// Apps Script. photoSrcRef принимает {fileId, key, thumbKey} и берёт прямую ссылку,
// если она есть.
function photoSrcRef(ref, wantThumb) {
  if (!ref) return Promise.resolve('');
  if (typeof ref === 'string') ref = { fileId: ref };
  const key = wantThumb ? (ref.thumbKey || ref.key) : (ref.key || ref.thumbKey);
  const direct = photoUrlFromKey(key);
  if (direct) return Promise.resolve(direct);
  return photoSrc(ref.fileId);
}

// Запасной путь для фото, которые ещё не залиты в Storage: сервер скачивает их из
// Telegram и отдаёт data URI. Медленно и по одной за раз, поэтому держим кэш
// промисов — иначе одно и то же фото качалось бы на каждое открытие карточки.
const _photoCache = new Map();
function photoSrc(fileId) {
  if (!fileId) return Promise.resolve('');
  if (_photoCache.has(fileId)) return _photoCache.get(fileId);
  const p = (async () => {
    try {
      const r = await fetch(`${API_URL}?type=photoUrl&file_id=${encodeURIComponent(fileId)}&${initDataQS()}`);
      const j = await r.json();
      return (j.ok && j.url) ? j.url : '';
    } catch (e) { return ''; }
  })();
  _photoCache.set(fileId, p);
  return p;
}

// quiet=true — запрос идёт молча, без индикатора занятости. Нужен для фоновых
// догрузок: карта уже на экране, и затемнять её ради данных, которых человек ещё не
// просил, — значит показывать «загрузку» второй раз подряд сразу после заставки.
async function callApi(action, payload, quiet) {
  const initData = tg ? tg.initData : '';
  if (!quiet) setBusy(true);
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, initData, payload }) });
    const json = await res.json();
    // Подпись Telegram живёт сутки. Держать приложение открытым дольше — обычное дело,
    // и раньше человек в этом случае получал безликое «не получилось», думая, что сломался бот.
    if (json && json.ok === false && json.error === 'auth') {
      setStatus(t('er_session'), 4000);
    }
    return json;
  } catch (e) { return { ok: false, error: 'network' }; }
  finally { if (!quiet) setBusy(false); }
}

// Диалоги через Telegram. window.confirm и window.alert в WebView Telegram на части
// платформ не показываются вовсе: confirm молча возвращает undefined, и обработчик
// выходит по первой же строке — кнопка выглядит нерабочей. Именно так «сломалась»
// кнопка «больше не слежу». Нативные showConfirm/showAlert работают везде, где есть
// поддержка (6.2+), а window.* остаётся фолбэком для браузера вне Telegram.
function uiConfirm(text) {
  return new Promise(resolve => {
    if (tg && typeof tg.showConfirm === 'function' && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
      try { tg.showConfirm(text, ok => resolve(!!ok)); return; } catch (e) {}
    }
    resolve(window.confirm(text));
  });
}
function uiAlert(text) {
  return new Promise(resolve => {
    if (tg && typeof tg.showAlert === 'function' && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) {
      try { tg.showAlert(text, () => resolve()); return; } catch (e) {}
    }
    window.alert(text); resolve();
  });
}

function copyToClipboard(text, label) {
  const done = () => setStatus(t('ok_copied') + (label || text), 1800);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); }
    else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
  } catch (e) { done(); }
  haptic('success');
}

// ================== КАРТОЧКА СОБАКИ ==================
// Живой счётчик символов под полем: лимиты те же, что в боте. maxlength не даёт
// превысить предел, а счётчик заранее показывает, сколько осталось — чтобы человек
// не обнаружил обрезанный текст уже после сохранения.
function updCount(el, max) {
  let c = el.parentNode.querySelector('.char-count');
  if (!c) { c = document.createElement('div'); c.className = 'char-count'; el.parentNode.appendChild(c); }
  const len = el.value.length;
  c.textContent = len + ' / ' + max;
  c.classList.toggle('over', len >= max);
}
function findDog(id) { return (dataCache.dogs || []).find(d => d.id.toString() === id.toString()); }

async function openDogCard(d) {
  // Находка в карточке похожа на уличную (комментарии, подписка, пересылка), но
  // дополнять анкету и добавлять фото может только нашедший, админ и модератор —
  // по этой карточке хозяин узнаёт свою собаку, и чужие правки его собьют.
  // Зеркало canEditDog_ на сервере.
  const isFound = d.status === 'Найдена';
  const isStreet = d.status === 'Уличная' || isFound;
  const isStaff = !!(me && me.profile && (me.profile.moderator || me.profile.isAdmin));
  // Описание находки и пометка «где собака сейчас» лежат в donorMemo одной строкой.
  const foundInfo = isFound ? splitFoundNote(d.donorMemo) : null;
  // Важное — всегда; второстепенное (только заполненное) — под «показать всё».
  const impRows = [
    d.breed ? [t('d_breed'), d.breed] : null,
    d.age ? [t('d_age'), d.age] : null,
    d.sex ? [t('d_sex'), d.sex] : null,
    [isFound ? t('d_found_where') : t('d_region'), ((d.city || '') + (d.region ? ', ' + d.region : '')) || '—'],
    [t('d_status'), d.status || '—']
  ].filter(Boolean);
  const extraRows = [
    d.color ? [t('d_color'), d.color] : null,
    d.tagNumber ? [t('d_tag'), d.tagNumber + (d.tagColor ? ' · ' + d.tagColor : '')] : null,
    d.sterilized ? [t('d_ster'), d.sterilized] : null,
    d.weightKg ? [t('d_weight'), d.weightKg + t('d_kg')] : null,
    d.vaccinated ? [t('d_vacc'), d.vaccinated] : null,
    d.isDonor ? [t('d_donor'), d.donorMemo || 'да'] : null,
    d.memo && isFound ? [t('d_signs'), d.memo] : null
  ].filter(Boolean);
  const infoHtml = rr => rr.map(r => `<div class="info-row"><span>${r[0]}</span><b>${escapeHtml(r[1])}</b></div>`).join('');
  const badges = [
    d.mine ? `<span class="badge brand">${t('b_mine')}</span>` : '',
    d.seekingHome ? `<span class="badge ok">${t('b_seeking')}</span>` : '',
    d.isDonor ? `<span class="badge">${t('b_donor')}</span>` : '',
    d.lost ? `<span class="badge warn">🚨 потерялась${d.lostDaysAgo != null ? ' · ' + d.lostDaysAgo + t('d_days') : ''}</span>` : '',
    isFound ? `<span class="badge warn">${t('b_found')}</span>` : '',
    !d.exactLocation && !d.lost ? `<span class="badge">${t('b_approx')}</span>` : ''
  ].join('');

  // Роли — зеркало логики бота (showDogCard). Опекунства больше нет: для уличной
  // собаки «моя» означает лишь «я её внёс и числюсь контактом».
  const isHomeMine = d.mine && d.status === 'У владельца';
  const isStreetMine = d.mine && d.status !== 'У владельца';
  const hasTag = !!(d.tagNumber && String(d.tagNumber).trim());
  // Зеркало canEditDog_: своя собака ИЛИ любая уличная — но пристраиваемую ведёт
  // только тот, кто её завёл: пока идёт поиск дома, чужие правки только путают.
  const seekLocked = !!d.seekingHome && !d.mine;
  const canEditGallery = !!d.mine || (isFound ? isStaff : (isStreet && !seekLocked));
  let actions = '';
  // Уличная: подтвердить, что пёс всё там же — один тап, без отправки новой точки.
  // Именно эти подтверждения удерживают собаку на карте (>3 мес — метка «устарело»,
  // >1 год — уходит с карты, >2 лет — становится неактивной).
  // У находки подтверждать нечего: место находки — единичное событие, а не точка,
  // по которой собака живёт. Кнопки «Собака здесь» и «Новая точка» ей не показываем.
  if (isStreet && !isFound && !d.lost && !seekLocked) {
    actions += `<button class="pop-btn" onclick="confirmDogGeo('${d.id}','${escapeAttr(d.name || '')}')">${t('a_here')}</button>`;
  }
  // Сразу под подтверждением — отправка новой точки. Две эти кнопки читаются вместе:
  // «пёс там же» или «пёс переехал». Раньше вторая уезжала вниз списка, в разные
  // ветки для своих и чужих, и выглядела как отдельная непонятная функция.
  // «Гуляет тут» здесь нет намеренно: это про домашнюю собаку на прогулке, у уличной
  // такого понятия нет — она живёт в районе, а не выходит гулять.
  if (isStreet && !isFound && !seekLocked) {
    actions += `<button class="pop-btn secondary" onclick="setDogGeoFromCard('${d.id}')">${t('a_newpin')}</button>`;
  }
  // Кнопка «показать на карте» бессмысленна, когда карточку и открыли с карты —
  // человек уже смотрит на эту точку.
  if (d.lat && activeScreen !== 'map') actions += `<button class="pop-btn secondary" onclick="showDogOnMap('${d.id}')">${t('a_showmap')}</button>`;
  actions += `<button class="pop-btn secondary" onclick="shareDog('${d.id}','${escapeAttr(d.name || 'Собака')}')">${t('a_share')}</button>`;
  // Фото грузится прямо здесь. Прежняя кнопка уводила в бота — она больше не нужна
  // и дублировала эту; права те же самые (canEditGallery).
  if (canEditGallery) actions += `<button class="pop-btn secondary" onclick="addPhotoFromCard('${d.id}')">${t('a_addphoto')}</button>`;
  if (isStreet) actions += `<button class="pop-btn secondary" id="subBtn-${d.id}" onclick="toggleDogSub('${d.id}')">${d.subscribed ? t('a_unsub') : t('a_sub')}</button>`;
  if (d.mine) {
    // Находку закрывает тот, кто её завёл: карточка удаляется, а получившим сообщение
    // о находке уходит хорошая новость. Кнопка первой — это главное действие находки.
    if (isFound) actions += `<button class="pop-btn" style="background:var(--green)" onclick="openFoundOwnerSheet('${d.id}')">${t('a_owner_found')}</button>`;
    actions += `<button class="pop-btn" onclick="openDogEditSheet(findDog('${d.id}'))">${t('a_edit')}</button>`;
    if (isHomeMine) {
      actions += `<button class="pop-btn secondary" onclick="walkHereMine('${d.id}')">${t('a_walks')}</button>`;
      actions += d.isDonor
        ? `<button class="pop-btn secondary" onclick="removeDonor('${d.id}')">${t('a_donor_rm')}</button>`
        : `<button class="pop-btn secondary" onclick="openDonorSheet('${d.id}','${escapeAttr(d.name || '')}')">${t('a_donor_add')}</button>`;
    }
    if (isStreetMine) {
      // Собаку с биркой пристраивают официально, через приют или организацию, —
      // отметка «ищет дом» для неё недоступна (та же проверка есть и на сервере).
      if (d.seekingHome) actions += `<button class="pop-btn secondary" onclick="toggleSeeking('${d.id}', false)">${t('a_seek_off')}</button>`;
      else if (!hasTag) actions += `<button class="pop-btn secondary" onclick="toggleSeeking('${d.id}', true)">${t('a_seek_on')}</button>`;
      actions += `<button class="pop-btn secondary" onclick="giveUpCare('${d.id}','${escapeAttr(d.name || '')}')">${t('a_giveup')}</button>`;
    }
    // «Потерялась» — только у домашней собаки. У уличной этого статуса нет: она
    // перемещается по району, и тревожная метка там обесценивала бы сигнал. Актуальность
    // держится подтверждениями «Собака здесь» и жизненным циклом геопозиции.
    // «Нашлась» показываем при любом статусе, если флаг стоит: у старых уличных анкет
    // он мог остаться, и его нужно чем-то снять.
    if (d.lost) actions += `<button class="pop-btn" style="background:var(--green)" onclick="markFound('${d.id}')">${t('a_found')}</button>`;
    else if (!isStreet) actions += `<button class="pop-btn danger" onclick="markLost('${d.id}')">${t('a_lost')}</button>`;
    actions += `<button class="pop-btn secondary" onclick="askDeleteDog('${d.id}','${escapeAttr(d.name || '')}')">${t('a_del')}</button>`;
  } else {
    // Связаться можно с владельцем домашней собаки — или с тем, кто ведёт уличную,
    // но только если она отмечена как «ищет дом». В остальных случаях человек,
    // внёсший пса на карту, не обязан отвечать за него перед незнакомыми.
    if (d.hasOwner && (!isStreet || d.seekingHome)) {
      actions += `<button class="pop-btn" onclick="contactOwner('${d.id}','${escapeAttr(d.name || '')}')">${isStreet ? t('a_contact_seek') : t('a_contact_home')}</button>`;
    }
    // Находка: главное действие постороннего — узнать свою собаку. Правка — только
    // админу и модератору.
    if (isFound) {
      actions += `<button class="pop-btn" onclick="claimFoundDog('${d.id}')">${t('a_found_mine')}</button>`;
      if (isStaff) actions += `<button class="pop-btn secondary" onclick="openDogEditSheet(findDog('${d.id}'))">${t('a_edit')}</button>`;
    }
    // Уличную дополняет любой (первичные данные о найденном псе) — кроме той,
    // что сейчас ищет новый дом: её анкету ведёт один человек.
    else if (isStreet && !seekLocked) {
      actions += `<button class="pop-btn secondary" onclick="openDogEditSheet(findDog('${d.id}'))">${t('a_fill')}</button>`;
    }
    // Спрятанные без объяснения кнопки читаются как поломка, поэтому говорим прямо.
    if (seekLocked) {
      actions += `<div class="list-sub" style="margin-top:8px">🏡 Анкету ведёт тот, кто ищет собаке дом. Когда отметка «ищет новый дом» будет снята, её снова сможет дополнять кто угодно.</div>`;
    }
    // Дубли и анкеты собак, которых давно нет во дворе, иначе вычистить некому.
    // Запрос уходит модератору — сам пользователь чужую анкету не сносит.
    if (isStreet && !seekLocked) actions += `<button class="pop-btn secondary" onclick="askDeleteDog('${d.id}','${escapeAttr(d.name || '')}', true)">${t('a_del_sug')}</button>`;
  }

  openSheet(`
    <div class="dog-card-head hero">
      <div id="dogPhoto" class="dog-photo" onclick="openDogLightbox()">🐕<span class="name-plate">${escapeHtml(d.name || 'Собака')}</span><span id="dogPhotoCount" class="photo-count" style="display:none"></span></div>
    </div>
    <div class="badges">${badges}</div>
    <div class="dog-info">${infoHtml(impRows)}</div>
    ${extraRows.length ? `<button class="more-toggle" id="moreToggle" onclick="toggleDogExtra()">${t('d_more')} ⌄</button>
      <div class="dog-info" id="dogExtra" style="display:none">${infoHtml(extraRows)}</div>` : ''}
    ${foundInfo ? `<div class="dog-memo"><b>${t('d_found_h')}</b>${foundInfo.text ? `<br>💬 ${escapeHtml(foundInfo.text)}` : ''}${
        foundInfo.withMe === true ? `<br>${t('d_found_withme')}` : foundInfo.withMe === false ? `<br>${t('d_found_onspot')}` : ''}</div>` : ''}
    ${d.memo && !isFound ? `<div class="dog-memo">📝 ${escapeHtml(d.memo)}</div>` : ''}
    <div class="pop-actions vertical">${actions}</div>
    <div class="comments-block">
      <div class="comments-title">${t('cm_head')}</div>
      <div id="commentsList" class="comments-inline"><div class="empty">…</div></div>
      <div class="comment-compose">
        <div class="cm-invite">${isFound
          ? t('cm_invite_found')
          : isStreet
          ? t('cm_invite_st') : t('cm_invite_home')}</div>
        <textarea id="commentText" placeholder="${t('cm_ph')}" maxlength="500" oninput="updCount(this,500)"></textarea>
        <button class="pop-btn" id="commentSendBtn" onclick="submitComment('${d.id}','${escapeAttr(d.name || '')}')">${t('cm_send')}</button>
      </div>
    </div>
  `);

  loadDogMedia(d);
  loadDogCommentsInline(d.id, d.name || '');
}

// Счётчик фотографий поверх обложки: раньше о том, что снимков несколько, можно было
// узнать только открыв галерею — а значит, почти никто и не открывал.
// Обложка: в списке собак уже лежит ключ превью (photoKey), поэтому картинка ставится
// сразу, без единого запроса. Галерея догружается следом — за счётчиком и листанием.
async function loadDogMedia(d) {
  window._lbPhotos = [];
  const el = document.getElementById('dogPhoto');
  if (el) el.classList.add('loading');   // мерцание только на месте фото, не на всём экране
  if (d.photoId || d.photoKey) {
    const ref = { fileId: d.photoId, thumbKey: d.photoKey };
    const direct = photoUrlFromKey(d.photoKey);
    if (direct && el) {
      el.style.backgroundImage = `url("${direct}")`; el.classList.add('loaded');
      window._lbPhotos = [ref];
    } else {
      try {
        const src = await photoSrcRef(ref, true);
        if (src && el) { el.style.backgroundImage = `url("${src}")`; el.classList.add('loaded'); window._lbPhotos = [ref]; }
      } catch (e) {}
    }
  }
  try {
    const r = await fetch(`${API_URL}?type=dogGallery&dogId=${encodeURIComponent(d.id)}&${initDataQS()}`);
    const j = await r.json();
    if (j && j.photoBase) notePhotoBase(j.photoBase);
    const photos = (j.ok ? j.photos : []) || [];
    if (photos.length) {
      photos.sort((a, b) => (b.isCover ? 1 : 0) - (a.isCover ? 1 : 0));
      window._lbPhotos = photos.filter(p => p.fileId || p.key);
      if (el && !el.classList.contains('loaded') && window._lbPhotos[0]) {
        const src0 = await photoSrcRef(window._lbPhotos[0], true);
        if (src0) { el.style.backgroundImage = `url("${src0}")`; el.classList.add('loaded'); }
      }
    }
    const cnt = document.getElementById('dogPhotoCount');
    if (cnt && window._lbPhotos.length > 1) {
      cnt.innerHTML = '<span style="font-size:13px">📷</span> ' + window._lbPhotos.length + ' фото';
      cnt.style.display = '';
      cnt.classList.add('has-more');
    }
  } catch (e) {}
  // Мерцание снимаем в любом случае: и когда фото приехало, и когда его нет вовсе —
  // иначе пустая рамка мерцала бы вечно.
  if (el) el.classList.remove('loading');
}

function toggleDogExtra() {
  const ex = document.getElementById('dogExtra'), btn = document.getElementById('moreToggle');
  if (!ex) return;
  const open = ex.style.display === 'none';
  ex.style.display = open ? '' : 'none';
  if (btn) btn.textContent = (open ? t('d_less') + ' ⌃' : t('d_more') + ' ⌄');
}

// Лайтбокс: фото на весь экран с листанием (свайп / стрелки / точки).
function openDogLightbox() {
  const photos = window._lbPhotos || [];
  if (!photos.length) return;
  window._lbIdx = 0;
  let ov = document.getElementById('lightbox');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'lightbox'; ov.className = 'lightbox';
    ov.innerHTML = `<button class="lb-close" onclick="closeLightbox()">✕</button>
      <button class="lb-nav lb-prev" onclick="event.stopPropagation();lbNav(-1)">‹</button>
      <img id="lbImg" class="lb-img" src="">
      <button class="lb-nav lb-next" onclick="event.stopPropagation();lbNav(1)">›</button>
      <div id="lbDots" class="lb-dots"></div>`;
    ov.onclick = (e) => { if (e.target === ov) closeLightbox(); };
    let sx = 0;
    ov.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    ov.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) lbNav(dx < 0 ? 1 : -1); }, { passive: true });
    document.body.appendChild(ov);
  }
  lbShow();
  ov.classList.add('show');
}
async function lbShow() {
  const photos = window._lbPhotos || [];
  const img = document.getElementById('lbImg');
  const idx = window._lbIdx;
  if (img) {
    img.src = '';
    const src = await photoSrcRef(photos[idx], false);   // в лайтбоксе — полный размер
    if (window._lbIdx === idx) img.src = src || '';   // пока грузили, могли пролистать дальше
  }
  const dots = document.getElementById('lbDots');
  if (dots) dots.innerHTML = photos.length > 1 ? photos.map((_, i) => `<span class="lb-dot ${i === window._lbIdx ? 'on' : ''}"></span>`).join('') : '';
  document.querySelectorAll('#lightbox .lb-nav').forEach(b => b.style.display = photos.length > 1 ? '' : 'none');
}
function lbNav(dir) {
  const photos = window._lbPhotos || [];
  if (!photos.length) return;
  window._lbIdx = (window._lbIdx + dir + photos.length) % photos.length;
  lbShow();
}
function closeLightbox() { const ov = document.getElementById('lightbox'); if (ov) ov.classList.remove('show'); }

// Комментарии прямо в карточке (лента + написать новый; submitComment переиспользуется).
async function loadDogCommentsInline(dogId, dogName) {
  const list = document.getElementById('commentsList');
  if (!list) return;
  try {
    // quiet: карточка уже на экране, и затемнять её ради ленты комментариев —
    // это ровно та «загрузка всей карточки», которая выглядит как подвисание.
    const res = await callApi('getComments', { dogId }, true);
    const items = res.ok ? (res.comments || []) : [];
    const canModerate = res.ok && res.canModerate;
    if (!items.length) { list.innerHTML = `<div class="empty">${t('cm_empty')}</div>`; return; }
    // Удалить можно свой комментарий (всегда) и чужой — если ты админ или модератор
    // города. Кнопка неприметная: красный цвет здесь читался как «пожаловаться» или
    // «опасное действие», хотя это обычная уборка в своей же ленте.
    list.innerHTML = items.map(c => `
      <div class="review-item">
        <div class="row-between"><span class="who">${escapeHtml(c.author || t('cm_guest'))}</span>
          ${(c.mine || canModerate) ? `<button class="cm-del" title="${t('cm_del_title')}" onclick="deleteComment('${c.id}','${dogId}','${escapeAttr(dogName)}')">🗑</button>` : ''}</div>
        <div class="txt">${escapeHtml(c.text)}</div>
        <div class="when">${escapeHtml(c.date || '')}</div>
      </div>`).join('');
  } catch (e) { list.innerHTML = `<div class="empty">${t('cm_empty')}</div>`; }
}

function showDogOnMap(id) {
  const d = findDog(id);
  if (!d || !d.lat) return;
  closeSheet();
  showScreen('map');
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.k === 'dogs'));
  activeTab = 'dogs'; subFilter = 'all';
  renderSubfilters(); renderLayer();
  map.setView([d.lat, d.lng], 16);
}

function openDogEditSheet(d) {
  const breedList = COMMON_BREEDS.slice();
  if (d.breed && breedList.indexOf(d.breed) < 0) breedList.unshift(d.breed);
  openSheet(`
    <h3>Редактировать «${escapeHtml(d.name || '')}»</h3>
    <div class="field"><label>${t('fd_name2')}</label><input type="text" id="edName" value="${escapeAttr(d.name || '')}"></div>
    <div class="field"><label>${t('fd_breed')}</label>
      <select id="edBreedSel" onchange="document.getElementById('edBreedManual').style.display = this.value==='__manual__' ? 'block':'none'">
        ${selOpts(breedList, d.breed)}
        <option value="__manual__">${t('fd_type_text')}</option>
      </select>
      <input type="text" id="edBreedManual" placeholder="${t('fd_breed_ph')}" style="display:none;margin-top:6px">
    </div>
    <div class="field"><label>${t('fd_color')}</label><input type="text" id="edColor" value="${escapeAttr(d.color || '')}" placeholder="${t('fd_color_ph')}"></div>
    <div class="field"><label>${t('fd_age')}</label><select id="edAge">${ageOptsHtml(d.age, '—')}</select></div>
    ${REGIONS_LIST.length ? `<div class="field"><label>${t('fd_region')}</label><select id="edRegion">${selOpts(REGIONS_LIST, d.region, '—')}</select></div>` : ''}
    <div class="field"><label>${t('fd_sex')}</label><select id="edSex">${selOpts(SEX_OPTIONS, d.sex, '—')}</select></div>
    <div class="field"><label>${t('fd_ster')}</label><select id="edSter">${selOpts(TRISTATE, d.sterilized || t('fd_unknown'))}</select></div>
    <div class="field"><label>${t('fd_weight')}</label><input type="number" step="0.1" id="edWeight" value="${escapeAttr(d.weightKg || '')}"></div>
    <div class="field"><label>${t('fd_vacc')}</label><select id="edVacc">${selOpts(TRISTATE, d.vaccinated, '—')}</select></div>
    <div class="field"><label>${t('fd_notes')}</label><textarea id="edMemo" maxlength="200" oninput="updCount(this,200)">${escapeHtml(d.memo || '')}</textarea></div>
    <button class="pop-btn secondary" style="margin-bottom:8px" onclick="updateDogPhoto('${d.id}')">📷 ${d.photoId ? t('ui_refresh') : t('fd_add')} фото</button>
    <button class="pop-btn" onclick="submitDogEdit('${d.id}')">${t('fd_save')}</button>
  `);
}

// Разбор описания находки: текст и пометка «у нашедшего / на месте» (зеркало
// splitFoundNote_ на сервере — пометку дописывают в конец и бот, и мини-апп).
function splitFoundNote(raw) {
  let text = (raw || '').toString().trim();
  let withMe = null;
  const mWith = '(собака у нашедшего)', mSpot = '(осталась на месте)';
  if (text.endsWith(mWith)) { withMe = true; text = text.slice(0, -mWith.length).trim(); }
  else if (text.endsWith(mSpot)) { withMe = false; text = text.slice(0, -mSpot.length).trim(); }
  return { text, withMe };
}

// «Это моя собака»: показываем контакты нашедшего, нашедшему сервер сообщает,
// кто откликнулся.
async function claimFoundDog(dogId) {
  if (_inFlight['foundMine']) return;
  _inFlight['foundMine'] = true;
  try {
    const res = await callApi('foundMine', { dogId });
    if (!res.ok) { uiAlert(res.error === 'closed' || res.error === 'not found' ? t('fm_closed') : t('err_fail') + (res.error || '')); return; }
    const lines = [];
    if (res.tg) lines.push(`Telegram: <b>${escapeHtml(res.tg)}</b>`);
    if (res.tel) lines.push(`${t('pf_phone')}: <b>${escapeHtml(res.tel)}</b>`);
    openSheet(`
      <h3>${t('fm_h')}</h3>
      <div class="dog-memo">${lines.length ? lines.join('<br>') : t('fm_nocontacts')}</div>
      <div class="hint" style="margin:8px 0 12px">${t('fm_notified')}</div>
      <button class="pop-btn secondary" onclick="closeSheet()">${t('ui_close')}</button>
    `);
    haptic('success');
  } finally { delete _inFlight['foundMine']; }
}
