<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Love Dogs · Тбилиси</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  /* ============ ТОКЕНЫ: «эмалевая табличка и латунный жетон» ============ */
  :root {
    /* семантика (имена сохранены — используются в JS-шаблонах) */
    --paw:      #e29c33;                /* латунь: собаки, первичные действия */
    --paw-deep: #b87a1d;
    --vet:      #1f5b4b;                /* хвоя: места */
    --shop:     #1f5b4b;
    --red:      #d24b3c;                /* потеряшки, опасные действия */
    --yellow:   #d9a13b;
    --green:    #2e7d5b;
    --grey:     #a49a8a;

    --bg:    var(--tg-theme-bg-color, #f8f4ec);
    --text:  var(--tg-theme-text-color, #272219);
    --hint:  var(--tg-theme-hint-color, #877e6e);
    --card:  var(--tg-theme-secondary-bg-color, #ffffff);
    --btnbg: var(--paw);
    --btntx: #2b2008;
    --line:  color-mix(in srgb, var(--text) 12%, transparent);

    /* Подложки и обводки НЕ фиксируем светлыми: иначе в тёмной теме Telegram
       поверх тёмного фона появлялись кремовые пятна, а тёмный текст на тёмном
       становился нечитаемым. Выводим их из фона/текста темы — работает в обеих. */
    --surface:      color-mix(in srgb, var(--paw) 14%, var(--card));  /* мягкая фирменная подложка */
    --surface-soft: color-mix(in srgb, var(--paw) 8%, var(--card));   /* ещё тише — треки, плейсхолдеры */
    --stroke:       var(--card);                                      /* обводка маркеров = цвет карточки */
    --on-brand:     #2b2008;                                          /* текст поверх янтарной заливки */
    --shadow-s: 0 1px 2px rgba(39,34,25,.06), 0 4px 14px rgba(39,34,25,.06);
    --shadow-m: 0 2px 6px rgba(39,34,25,.10), 0 10px 30px rgba(39,34,25,.14);
    --r-card: 18px;
    --r-ctl: 13px;
    --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-disp: "Unbounded", "Manrope", sans-serif;
    --tabbar-h: calc(62px + env(safe-area-inset-bottom));
  }
  /* Тёмная тема. Telegram отдаёт свои цвета фона и текста, а фирменные подложки
     считаются от них выше. Здесь только то, что нельзя вывести автоматически:
     чуть приглушаем янтарь и делаем тени глубже — на тёмном фоне светлые тени не видны. */
  @media (prefers-color-scheme: dark) {
    :root {
      --paw:      #d9973a;
      --paw-deep: #f0b968;   /* на тёмном «глубокий» оттенок должен быть СВЕТЛЕЕ базового */
      --shadow-s: 0 1px 2px rgba(0,0,0,.36), 0 4px 14px rgba(0,0,0,.30);
      --shadow-m: 0 2px 6px rgba(0,0,0,.44), 0 10px 30px rgba(0,0,0,.40);
    }
  }
  /* Telegram может явно сообщить тёмную схему — учитываем и это (класс ставится из JS). */
  body.tg-dark {
    --paw:      #d9973a;
    --paw-deep: #f0b968;
    --shadow-s: 0 1px 2px rgba(0,0,0,.36), 0 4px 14px rgba(0,0,0,.30);
    --shadow-m: 0 2px 6px rgba(0,0,0,.44), 0 10px 30px rgba(0,0,0,.40);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font-body); font-size: 14px; line-height: 1.45; overflow: hidden;
    -webkit-font-smoothing: antialiased; }
  #app { height: 100vh; height: 100dvh; position: relative; }
  button { font-family: var(--font-body); }
  :focus-visible { outline: 2px solid var(--paw); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ================= КАРТА (главный экран) ================= */
  #map { position: absolute; inset: 0 0 var(--tabbar-h) 0; background: var(--bg); }
  #map-topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 700; padding: 10px 12px 14px;
    pointer-events: none; }
  #map-topbar > * { pointer-events: auto; }
  #tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px;
    background: rgba(248,244,236,.85);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow-s); border: 1px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 999px; font-size: 13px; font-weight: 700;
    color: var(--hint); transition: background .18s ease, color .18s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; user-select: none; }
  .tab.active { color: #fff; }
  .tab[data-k="dogs"].active { background: var(--paw); color: var(--btntx); }
  .tab[data-k="places"].active { background: var(--vet); }
  #subfilters { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; padding: 2px; }
  #subfilters::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: rgba(248,244,236,.88);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: var(--hint); cursor: pointer; user-select: none; border: 1px solid var(--line);
    transition: background .15s ease, color .15s ease; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  #status { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); z-index: 750;
    background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 600; padding: 8px 16px;
    border-radius: 999px; box-shadow: var(--shadow-m); pointer-events: none; opacity: 0;
    transition: opacity .2s ease; max-width: 86%; text-align: center; }
  #status.show { opacity: 1; }
  #count-badge { position: absolute; bottom: calc(var(--tabbar-h) + 14px); left: 14px; z-index: 600;
    background: rgba(248,244,236,.9);
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); color: var(--text); font-size: 12px; font-weight: 700;
    letter-spacing: .01em; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
    box-shadow: var(--shadow-s); }
  #fab { position: absolute; top: 108px; right: 14px; z-index: 750;
    width: 52px; height: 52px; border-radius: 18px; background: var(--vet); color: #fff; border: none;
    font-size: 26px; font-weight: 400; box-shadow: var(--shadow-m); cursor: pointer; display: none;
    align-items: center; justify-content: center; transition: transform .12s ease; }
  #fab:active { transform: scale(.94); }
  #fab.show { display: flex; }

  /* Маркеры-«жетоны»: эмалевый кружок с латунным ободком */
  /* Подложку попапа красим переменными темы: у Leaflet по умолчанию белый фон,
     и в тёмной теме Telegram светлый --text становился невидимым */
  .leaflet-popup-content-wrapper { border-radius: 16px; box-shadow: var(--shadow-m);
    background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .leaflet-popup-tip { background: var(--card); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--hint); }
  .leaflet-popup-content { margin: 13px 15px; font-size: 13.5px; line-height: 1.45; width: 240px !important;
    font-family: var(--font-body); color: var(--text); }
  .leaflet-popup-content .pop-title { color: var(--text); }
  .leaflet-bar a { background: var(--card) !important; color: var(--text) !important;
    border-color: var(--line) !important; }
  .marker-pin { width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2.5px solid var(--stroke); box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.22); }
  .marker-pin span { font-size: 14px; }
  .marker-pin.lost { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(210,75,60,.5);} 70% { box-shadow: 0 0 0 13px rgba(210,75,60,0);} 100% { box-shadow: 0 0 0 0 rgba(210,75,60,0);} }
  .marker-pin.closed { opacity: .45; }
  .marker-pin.moderation { border-style: dashed; border-color: #E0A93B; }
  /* «Моя собака»: кольцо + сердечко-бейдж. Одного кольца оказалось мало — раньше
     свои собаки читались как обычные домашние (иконка статуса у них одинаковая). */
  .marker-pin.mine { border-color: var(--paw-deep); border-width: 3px; }
  .marker-pin.mine::after { content: "💛"; position: absolute; right: -5px; bottom: -4px;
    font-size: 12px; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .marker-pin { position: relative; }
  /* Уличная с устаревшей гео (>3 мес без подтверждений): приглушённая и с пунктирным
     кольцом — читается как «не подтверждено», но не спорит с алармом потеряшки. */
  .marker-pin.stale { border-style: dashed; opacity: .6; }
  .marker-pin.stale span { opacity: .75; }

  /* Режим выбора точки */
  #pick-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 800;
    font-size: 36px; pointer-events: none; display: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  #pick-bar { position: absolute; left: 14px; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px);
    z-index: 800; background: var(--card); border-radius: var(--r-card); padding: 14px;
    box-shadow: var(--shadow-m); display: none; border: 1px solid var(--line); }
  #pick-bar .pick-hint { font-size: 12.5px; color: var(--hint); margin-bottom: 10px; text-align: center; }
  #pick-bar .row { display: flex; gap: 8px; }
  body.picking #pick-pin, body.picking #pick-bar { display: block; }
  body.picking #map-topbar, body.picking #fab, body.picking #count-badge, body.picking #tabbar { display: none; }
  body.picking #map { inset: 0; }

  /* Хром карты — только на экране карты */
  body:not([data-screen="map"]) #map-topbar,
  body:not([data-screen="map"]) #count-badge,
  body:not([data-screen="map"]) #fab,
  body:not([data-screen="map"]) #status { display: none !important; }

  /* ================= ЭКРАНЫ-СПИСКИ ================= */
  .screen { position: absolute; inset: 0 0 var(--tabbar-h) 0; background: var(--bg); z-index: 650;
    overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; padding: 18px 16px 28px; }
  .screen.show { display: block; }
  .screen h2 { font-family: var(--font-disp); font-size: 19px; font-weight: 600; letter-spacing: -.01em;
    margin: 2px 0 14px; }
  .sec-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--hint); margin: 22px 0 9px; }
  .card { background: var(--card); border-radius: var(--r-card); padding: 14px 15px; margin-bottom: 10px;
    border: 1px solid var(--line); box-shadow: var(--shadow-s); }
  .card.tappable { cursor: pointer; transition: transform .1s ease; }
  .card.tappable:active { transform: scale(.985); }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .list-title { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .list-sub { font-size: 12.5px; color: var(--hint); margin-top: 3px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: rgba(39,34,25,.07);
    background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
  .badge.warn { background: rgba(210,75,60,.14);
    background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .badge.ok { background: rgba(46,125,91,.14);
    background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .badge.brand { background: var(--surface); color: var(--paw-deep); }
  .pop-badges, .badges { margin-top: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--hint); font-size: 13.5px; padding: 34px 12px; }
  .empty .big { font-size: 38px; margin-bottom: 10px; }

  .searchbox { display: flex; align-items: center; gap: 9px; background: var(--card); border-radius: var(--r-ctl);
    padding: 11px 13px; margin-bottom: 10px; border: 1px solid var(--line); }
  .searchbox input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 14px;
    font-family: var(--font-body); outline: none; }
  .searchbox input::placeholder { color: var(--hint); }
  .seg-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin-bottom: 6px; }
  .seg-scroll::-webkit-scrollbar { display: none; }
  .seg-scroll .chip { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .seg-scroll .chip.active { background: var(--text); color: var(--bg); }

  .pop-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .pop-row { color: var(--hint); font-size: 13px; }
  .pop-row a { color: var(--vet); font-weight: 600; }

  /* Кнопки */
  .pop-btn { border: none; border-radius: var(--r-ctl); padding: 12px 12px; font-size: 13.5px; font-weight: 800;
    letter-spacing: .01em; background: var(--btnbg); color: var(--btntx); cursor: pointer; width: 100%;
    transition: transform .1s ease, filter .15s ease; }
  .pop-btn:active { transform: scale(.98); filter: brightness(.96); }
  .pop-btn.secondary { background: rgba(39,34,25,.07);
    background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); }
  .pop-btn.danger { background: var(--red); color: #fff; }
  .pop-btn.small { width: auto; padding: 9px 13px; font-size: 12.5px; }
  .pop-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .pop-btn { flex: 1; }

  .stars { cursor: pointer; font-size: 30px; line-height: 1; user-select: none;
    display: flex; gap: 6px; justify-content: center; padding: 6px 0; flex-wrap: nowrap; max-width: 100%; }
  .stars .star { transition: transform .1s ease; flex: 0 0 auto; }
  .stars .star:active { transform: scale(1.3); }
  .stars-small { font-size: 12.5px; }
  .pack-marker { background: none; border: none; }
  .pack-badge { background: var(--street, #6b7280); color: #fff; font-weight: 700; font-size: 12px;
    padding: 5px 10px; border-radius: 14px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    border: 2px solid var(--stroke); text-align: center; }
  /* Значок кластера маркеров (число слипшихся меток) */
  .cluster-marker { background: transparent; }
  .cluster-badge { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: var(--paw); color: var(--btntx, #2b2008); font-weight: 800; font-size: 13px;
    border-radius: 50%; border: 2px solid var(--stroke); box-shadow: 0 2px 8px rgba(0,0,0,.3); }

  /* донорские фильтры */
  #donor-panel { background: var(--card); border-radius: var(--r-card); padding: 13px 14px; margin-bottom: 10px;
    display: none; border: 1px solid var(--line); }
  #donor-panel.show { display: block; }
  #donor-panel .fline { display: flex; align-items: center; justify-content: space-between; padding: 7px 0;
    font-size: 13.5px; font-weight: 600; }
  input[type="range"] { width: 55%; accent-color: var(--paw); }
  .switch { position: relative; width: 44px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-t { position: absolute; inset: 0; background: rgba(39,34,25,.2);
    background: color-mix(in srgb, var(--text) 18%, transparent);
    border-radius: 999px; transition: background .15s; }
  .slider-t:before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: var(--card); border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .slider-t { background: var(--paw); }
  .switch input:checked + .slider-t:before { transform: translateX(18px); }

  /* профиль */
  .avatar { width: 58px; height: 58px; border-radius: 50%; background: var(--surface);
    border: 2px solid color-mix(in srgb, var(--paw) 45%, transparent);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex: 0 0 auto; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line);
    font-size: 13.5px; gap: 12px; }
  .info-row:last-child { border-bottom: none; }
  .info-row span { color: var(--hint); flex-shrink: 0; }
  .info-row b { text-align: right; word-break: break-word; font-weight: 700; }

  /* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
  #tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tabbar-h); z-index: 900;
    background: rgba(248,244,236,.92);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  /* Навигация без подписей: иконки самодостаточны, а подписи съедали высоту
     и мешали на маленьких экранах. Активный пункт выделяем «таблеткой». */
  .nav-item { flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--hint); cursor: pointer; user-select: none; position: relative;
    height: 46px; transition: color .15s ease; }
  .nav-item .ico { font-size: 23px; line-height: 1; transition: transform .18s ease; }
  .nav-item.active { color: var(--paw-deep); }
  .nav-item.active::before { content: ""; position: absolute; width: 52px; height: 34px;
    border-radius: 999px; background: var(--surface); z-index: -1; }
  .nav-item.active .ico { transform: translateY(-1px) scale(1.06); }
  .nav-item:active .ico { transform: scale(.92); }
  .nav-dot { position: absolute; top: 8px; right: calc(50% - 16px); width: 8px; height: 8px;
    border-radius: 50%; background: var(--red); display: none; border: 1.5px solid var(--bg); }
  .nav-dot.show { display: block; }

  /* ================= НИЖНИЙ ЛИСТ: «паспорт двора» ================= */
  #sheet-overlay { position: fixed; inset: 0; background: rgba(30,25,17,.42); z-index: 1000; display: none; }
  #sheet-overlay.show { display: block; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-radius: 22px 22px 0 0; z-index: 1001;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .24s cubic-bezier(.32,.72,.33,1);
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 -8px 40px rgba(30,25,17,.25); }
  #sheet.show { transform: translateY(0); }
  #sheet:before { content: ""; display: block; width: 40px; height: 4px; border-radius: 999px;
    background: rgba(39,34,25,.24);
    background: color-mix(in srgb, var(--text) 22%, transparent); margin: 2px auto 14px; }
  #sheet h3 { font-family: var(--font-disp); font-size: 16px; font-weight: 600; letter-spacing: -.01em;
    margin: 0 0 14px; }
  .field { margin-bottom: 11px; }
  .field label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--hint); display: block; margin-bottom: 5px; }
  .field input[type=text], .field input[type=tel], .field input[type=number], .field textarea, .field select {
    width: 100%; padding: 11px 12px; border-radius: var(--r-ctl); border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 14px; font-family: var(--font-body);
    appearance: none; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--paw); box-shadow: 0 0 0 3px color-mix(in srgb, var(--paw) 22%, transparent); }
  .field textarea { resize: vertical; min-height: 64px; }
  .char-count { font-size: 11.5px; color: var(--hint); text-align: right; margin-top: 3px; }
  /* --- Дашборд админа --- */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 9px; text-align: center; }

  .kpi.good .val { color: var(--green); } .kpi.warn .val { color: var(--red); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12.5px; }

  .spark-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--hint); margin-top: 4px; }
  .char-count.over { color: var(--red); font-weight: 700; }
  .field-row { display: flex; align-items: center; gap: 8px; }

  .dog-card-head { display: flex; align-items: center; gap: 13px; margin: 0 -18px 12px;

    background: linear-gradient(160deg, #eeb04a, var(--paw) 55%, var(--paw-deep));

  .dog-card-head::before { content: ""; position: absolute; top: 12px; right: 16px; width: 13px; height: 13px;

  .dog-card-head h3 { margin: 0; color: var(--on-brand); font-family: var(--font-disp); font-size: 17px; }
  .dog-card-head.hero h3 { font-size: 19px; text-align: center; }

  .dog-memo { background: rgba(39,34,25,.05);
    background: color-mix(in srgb, var(--text) 5%, transparent); border-radius: var(--r-ctl);

  #geo-status, .geo-note { font-size: 12px; color: var(--hint); margin-top: 5px; }
  .seg-pick { display: flex; gap: 6px; flex-wrap: wrap; }

  .seg-pick .opt.active { border-color: var(--paw); color: var(--paw-deep); font-weight: 800;

  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-soft); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;

function applyTgColorScheme() {
  var dark = tg && (tg.colorScheme === 'dark' ||
    (tg.themeParams && tg.themeParams.bg_color && isDarkHex(tg.themeParams.bg_color)));
  document.body.classList.toggle('tg-dark', !!dark);

function isDarkHex(hex) {
  var h = (hex || '').replace('#', '');
  if (h.length !== 6) return false;
  var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);

function langFromTg(code) {
  const c = (code || '').toLowerCase();
  if (c.startsWith('ru')) return 'RU';
  if (c.startsWith('ka') || c.startsWith('ge')) return 'GE';
  return c ? 'EN' : 'RU';
}
let LANG = langFromTg(tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.language_code : '');
function t(key) {
  const d = I18N[LANG] || I18N.RU;
  return d[key] !== undefined ? d[key] : (I18N.RU[key] !== undefined ? I18N.RU[key] : key);
}
// Переводит статичную разметку: элементы помечены data-i18n="ключ".
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  // Иконочная навигация без подписей — переводим доступное имя, а не видимый текст
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = t(el.getAttribute('data-i18n-title'));
    el.setAttribute('title', v); el.setAttribute('aria-label', v);
  });
  document.documentElement.setAttribute('lang', LANG.toLowerCase());
}
// Вызывается после загрузки профиля: сохранённый в боте язык важнее языка Telegram.
function syncLangFromProfile(p) {
  if (p && p.lang && I18N[p.lang] && p.lang !== LANG) { LANG = p.lang; applyStaticI18n(); return true; }
  return false;
}

const CITY_CENTERS = {
  'Тбилиси': [41.7151, 44.8271], 'Батуми': [41.6168, 41.6367],
  'Кутаиси': [42.2679, 42.7180], 'Рустави': [41.5495, 45.0028]
};
const TBILISI_CENTER = CITY_CENTERS['Тбилиси'];
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView(TBILISI_CENTER, 12);
let mapCentered = false;
// Центрируем карту по городу пользователя, как только узнаём профиль
function centerMapByCity(city) {
  if (mapCentered) return;
  // Приоритет — координаты из профиля (бот знает центр любого города, вкл. РФ),
  // затем локальный словарь как фолбэк
  const c = (me && me.cityCenter) || CITY_CENTERS[city];
  if (c) { map.setView(c, 12); mapCentered = true; }
}
// Стандартная подложка Google Maps (lyrs=m — «карта»; h=гибрид, s=спутник при желании)
L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=ru&x={x}&y={y}&z={z}', {
  maxZoom: 20, subdomains: ['0', '1', '2', '3']
}).addTo(map);

// Кластеризация: близкие маркеры (наплыв >50% при текущем зуме) объединяются в значок
// с числом; при увеличении масштаба / клике по кластеру — разъединяются.
// maxClusterRadius≈16px ≈ половина иконки 30px → кластер возникает только при наплыве >50%.
let currentLayer = L.markerClusterGroup({
  maxClusterRadius: 16,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  zoomToBoundsOnClick: true,
  removeOutsideVisibleBounds: true,
  chunkedLoading: true,
  iconCreateFunction: function (cluster) {
    var n = cluster.getChildCount();
    var size = n < 10 ? 34 : (n < 100 ? 40 : 46);
    return L.divIcon({
      html: '<div class="cluster-badge">' + n + '</div>',
      className: 'cluster-marker',
      iconSize: [size, size], iconAnchor: [size / 2, size / 2]
    });
  }
}).addTo(map);

const TAG_HOMOGLYPHS = { 'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','У':'Y','Х':'X' };

  for (const chRaw of s) {
    const ch = TAG_HOMOGLYPHS[chRaw] || chRaw;
    if (/[A-Z0-9\u0400-\u04FF\u10A0-\u10FF]/.test(ch)) out += ch;
  }
  return out;
}

function pinIcon(kind, item) {

  // Три независимых сигнала теперь не конкурируют за один и тот же слот:
  //  • статус (домашняя/у опекуна/уличная) — иконка внутри кружка (🏠/🤝/🐕);

// Расстояние между точками в метрах (гаверсинус)
function distMeters(a, b) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]), dLng = toRad(b[1] - a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Группируем уличных собак в стаи: 3+ в радиусе 50 м → один маркер «Стая (n)»
function clusterStreetDogs(list) {
  const PACK_RADIUS = 50, PACK_MIN = 3;
  const street = list.filter(d => d.status === 'Уличная' && !d.lost && d.lat && d.lng);
  const rest = list.filter(d => !(d.status === 'Уличная' && !d.lost && d.lat && d.lng));
  const used = new Array(street.length).fill(false);
  const packs = [], singles = [];
  for (let i = 0; i < street.length; i++) {
    if (used[i]) continue;
    const group = [street[i]]; used[i] = true;
    for (let j = i + 1; j < street.length; j++) {
      if (used[j]) continue;
      if (distMeters([street[i].lat, street[i].lng], [street[j].lat, street[j].lng]) <= PACK_RADIUS) { group.push(street[j]); used[j] = true; }
    }
    if (group.length >= PACK_MIN) packs.push(group); else group.forEach(d => singles.push(d));
  }
  return { packs, singles: singles.concat(rest) };
}
async function renderLayer() {
  const kind = activeTab;
  const raw = await loadData(kind);
  let list = kind === 'dogs' ? filterDogsMap(raw) : filterPlacesMap(raw);
  currentLayer.clearLayers();
  if (kind === 'dogs') {
    const { packs, singles } = clusterStreetDogs(list);
    // Маркеры-стаи
    packs.forEach(group => {
      const lat = group.reduce((s, d) => s + d.lat, 0) / group.length;
      const lng = group.reduce((s, d) => s + d.lng, 0) / group.length;
      const icon = L.divIcon({ className: 'pack-marker', html: `<div class="pack-badge">🐾 Стая (${group.length})</div>`, iconSize: [90, 30], iconAnchor: [45, 30] });
      const marker = L.marker([lat, lng], { icon });
      marker.on('click', () => openPackSheet(group));
      currentLayer.addLayer(marker);
    });
    // Одиночные собаки
    singles.forEach(item => {
      if (!item.lat || !item.lng) return;
      const marker = L.marker([item.lat, item.lng], { icon: pinIcon('dogs', item) });
      marker.on('click', () => openDogCard(item));
      currentLayer.addLayer(marker);
    });
    document.getElementById('count-badge').textContent = `🐕 ${list.length} собак`;
  } else {
    list.forEach(item => {
      if (!item.lat || !item.lng) return;
      const marker = L.marker([item.lat, item.lng], { icon: pinIcon(kind, item) });
      marker.bindPopup(placePopupHtml(item));
      currentLayer.addLayer(marker);
    });
    document.getElementById('count-badge').textContent = `📍 ${list.length} мест`;
  }
  document.getElementById('lostDot').classList.toggle('show', !!(dataCache.dogs || []).some(d => d.lost));
}

    !d.exactLocation && !d.lost ? `<span class="badge">${t('b_approx')}</span>` : ''

  // Роли — зеркало логики бота (showDogCard):

  const isHomeMine = d.mine && d.status === 'У владельца';
  const isGuardianMine = d.mine && (d.status === 'У опекуна' || d.status === 'Уличная');
  // Зеркало canEditDog_: свой владелец/опекун ИЛИ бесхозная уличная (её редактирует любой)
  const canEditGallery = !!d.mine || (isStreet && !d.hasOwner);
  let actions = '';
  // Уличная: подтвердить, что пёс всё там же — один тап, без отправки новой точки.
  // Именно эти подтверждения удерживают собаку на карте (>3 мес — метка «устарело»,

    actions += `<button class="pop-btn" onclick="confirmDogGeo('${d.id}','${escapeAttr(d.name || '')}')">${t('a_here')}</button>`;

  actions += `<button class="pop-btn secondary" onclick="shareDog('${d.id}','${escapeAttr(d.name || 'Собака')}')">${t('a_share')}</button>`;
  actions += `<button class="pop-btn secondary" onclick="showDogGallery('${d.id}','${escapeAttr(d.name || '')}',${canEditGallery})">${t('a_gallery')}</button>`;
  actions += `<button class="pop-btn secondary" onclick="showDogComments('${d.id}','${escapeAttr(d.name || '')}')">${t('a_comments')}</button>`;
  if (d.mine) {
    actions += `<button class="pop-btn" onclick="openDogEditSheet(findDog('${d.id}'))">${t('a_edit')}</button>`;
    if (isHomeMine) {
      actions += `<button class="pop-btn secondary" onclick="walkHereMine('${d.id}')">${t('a_walks')}</button>`;

        ? `<button class="pop-btn secondary" onclick="removeDonor('${d.id}')">🚫 Убрать из доноров</button>`
        : `<button class="pop-btn secondary" onclick="openDonorSheet('${d.id}','${escapeAttr(d.name || '')}')">🩸 Стать донором крови</button>`;
    } else {
      actions += `<button class="pop-btn secondary" onclick="setDogGeoFromCard('${d.id}')">${t('a_updgeo')}</button>`;
    }
    if (isGuardianMine) {
      actions += d.seekingHome
        ? `<button class="pop-btn secondary" onclick="toggleSeeking('${d.id}', false)">🏡 Снять «ищет дом»</button>`
        : `<button class="pop-btn secondary" onclick="toggleSeeking('${d.id}', true)">🏡 Отметить «ищет дом»</button>`;
      actions += `<button class="pop-btn secondary" onclick="giveUpCare('${d.id}','${escapeAttr(d.name || '')}')">🙅 Отказаться от опеки</button>`;

    else actions += `<button class="pop-btn" style="background:var(--green)" onclick="markFound('${d.id}')">🎉 Нашлась!</button>`;
    actions += `<button class="pop-btn secondary" onclick="askDeleteDog('${d.id}','${escapeAttr(d.name || '')}')">🗑 Удалить анкету</button>`;
  } else {
    if (d.hasOwner) actions += `<button class="pop-btn" onclick="contactOwner('${d.id}')">✉️ Связаться с хозяином</button>`;
    // Уличную без владельца может дозаполнить любой (первичные данные)
    if (isStreet && !d.hasOwner) {
      actions += `<button class="pop-btn secondary" onclick="openDogEditSheet(findDog('${d.id}'))">✏️ Дополнить анкету</button>`;
    }
    // Взять опекунство: как в боте — если хозяина нет вовсе или собака не домашняя
    if (!d.hasOwner || d.status !== 'У владельца') {
      actions += `<button class="pop-btn secondary" onclick="takeCare('${d.id}','${escapeAttr(d.name || '')}')">🤲 Взять опекунство</button>`;
    }
    if (isStreet) actions += `<button class="pop-btn secondary" onclick="setDogGeoFromCard('${d.id}')">${t('a_updgeo')}</button>`;
  }

  openSheet(`
    <div class="dog-card-head hero"><div id="dogPhoto" class="dog-photo" onclick="showDogGallery('${d.id}','${escapeAttr(d.name || '')}',${canEditGallery})">🐕</div><h3>${escapeHtml(d.name || 'Собака')}</h3></div>

    <div class="dog-info">${rows.map(r => `<div class="info-row"><span>${r[0]}</span><b>${escapeHtml(r[1])}</b></div>`).join('')}</div>
    ${d.memo ? `<div class="dog-memo">📝 ${escapeHtml(d.memo)}</div>` : ''}
    <div class="pop-actions vertical">${actions}</div>
  `);

  if (d.photoId) {
    try {
      const r = await fetch(`${API_URL}?type=photoUrl&file_id=${encodeURIComponent(d.photoId)}`);
      const j = await r.json();
      const el = document.getElementById('dogPhoto');
      if (j.ok && j.url && el) { el.style.backgroundImage = `url('${j.url}')`; el.classList.add('loaded'); }
    } catch (e) {}
  }
}

let addDogDraft = null;
// Быстрое добавление УЛИЧНОЙ собаки прямо с карты (частый полевой сценарий)

function openAddDogSheet(draft) {

    <div class="field"><label>${t('fd_breed')}</label>

    <div class="field"><label>${t('fd_ster')}</label><select id="adSter">${selOpts(TRISTATE, d.sterilized || t('fd_unknown'))}</select></div>
    <div class="field"><label>${t('fd_tag')}</label>
      <div class="field-row">

    <button class="pop-btn secondary" onclick="addDogPickGeo()">${d.lat ? t('fd_pin_set') : t('fd_pin')}</button>
    <div class="geo-note">${d.lat ? '✅ ' + d.lat + ', ' + d.lng : t('fd_pin_hint')}</div>

function collectAddDogDraft() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  addDogDraft = Object.assign(addDogDraft || {}, {
    name: g('adName'), breed: g('adBreedSel'), breedManual: g('adBreedManual'), color: g('adColor'),
    sex: g('adSex'), age: g('adAge'), region: g('adRegion'),
    sterilized: g('adSter'), tagNumber: g('adTagNum'), tagColor: g('adTagColor'), memo: g('adMemo')
  });
}
async function addDogPickGeo() {
  collectAddDogDraft();
  const choice = await pickOnMap(addDogDraft.lat ? [addDogDraft.lat, addDogDraft.lng] : null);
  if (choice) { addDogDraft.lat = choice.lat; addDogDraft.lng = choice.lng; }
  openAddDogSheet();
}
let addDogSubmitting = false;
async function submitAddDog() {
  // Сохранение идёт заметное время (запись в таблицу + уведомления), и без защиты
  // повторные тапы создавали ДУБЛИ анкет. Блокируем кнопку на время запроса.
  if (addDogSubmitting) return;
  collectAddDogDraft();
  const d = addDogDraft;
  if (!d.name || !d.name.trim()) { alert('Кличка обязательна 🐶'); return; }
  if (d.status === 'Уличная') {
    alert('📸 Уличную собаку добавляй через бота — нужно фото, без которого её не опознать. Открой бота → «Добавить собаку».');
    return;
  }
  let breed = d.breed === '__manual__' ? (d.breedManual || '').trim() : d.breed;
  if (d.breed === '__manual__' && breed && !/^[A-Za-zА-Яа-яЁё\u10A0-\u10FF\s-]+$/.test(breed)) {
    alert('Порода — только буквы и дефис.'); return;
  }
  const payload = {
    status: d.status, name: d.name.trim(), breed, color: d.color, sex: d.sex, age: d.age,
    region: d.region || '', sterilized: d.sterilized, tagNumber: d.tagNumber,
    tagColor: d.tagColor, memo: d.memo, lat: d.lat || '', lng: d.lng || ''
  };
  const btn = document.getElementById('addDogSaveBtn');
  addDogSubmitting = true;
  if (btn) { btn.disabled = true; btn.textContent = t('cm_sending'); }
  try {
    const res = await callApi('addDog', payload);
    if (res.ok) {
      haptic(); addDogDraft = null; closeSheet();
      dataCache.dogs = null; await renderLayer(); renderDogsScreen();
      setStatus('✅ Собака добавлена!', 2200);
    } else if (res.error === 'limit') alert('Достигнут лимит анкет на одного человека.');
    else if (res.error === 'duplicate') alert('Такая собака уже добавлена 🙂');
    else if (res.error === 'tag_required') alert('🏷️ У уличной собаки бирка обязательна.');
    else if (res.error === 'geo_required') alert('📍 Для уличной собаки отметь точку на карте.');
    else if (res.error === 'street_use_bot') alert('📸 Уличную собаку добавляй через бота — там можно приложить фото.');
    else alert(t('err_fail') + (res.error || ''));
  } finally {
    addDogSubmitting = false;
    if (btn) { btn.disabled = false; btn.textContent = t('fd_save'); }
  }
}

let dogSegment = 'all'; // по умолчанию — все собаки города (без фильтров)
const DOG_SEGMENTS = [['all','Все'], ['street','🌳 Уличные'], ['home','🏠 Домашние'], ['mine','💛 Мои'], ['lost','🚨 Потеряшки'], ['seeking','🏡 Ищут дом'], ['donors','🩸 Доноры']];
async function initDogsScreen() {
  await loadData('dogs');
  if (dogSegment === null) dogSegment = 'all';
  renderDogSegments();
  renderDogsScreen();
}
function renderDogSegments() {
  const box = document.getElementById('dogSegments');
  box.innerHTML = '';
  DOG_SEGMENTS.forEach(([k, label]) => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (dogSegment === k ? ' active' : '');
    chip.textContent = label;
    chip.onclick = () => { dogSegment = k; renderDogSegments(); renderDogsScreen(); };

function fillRegionFilter() {
  const sel = document.getElementById('dogRegion');
  if (sel.options.length > 1 || !REGIONS_LIST.length) return;
  REGIONS_LIST.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
}
function renderDogsScreen() {
  fillRegionFilter();
  const list = dataCache.dogs || [];
  const q = (document.getElementById('dogSearch').value || '').trim().toLowerCase();
  const reg = document.getElementById('dogRegion').value;
  document.getElementById('donor-panel').classList.toggle('show', dogSegment === 'donors');
  // Город профиля: экран собак показывает только собак своего города (как и карта)
  const myCity = me && me.profile ? me.profile.city : null;
  let scoped = myCity ? list.filter(d => !d.city || d.city === myCity) : list;
  let filtered = scoped;
  // Пока идёт поиск — ищем по ВСЕЙ базе города, сегмент игнорируем (иначе «Мои» прячет чужих)
  if (!q) {
    if (dogSegment === 'mine') filtered = scoped.filter(d => d.mine);
    if (dogSegment === 'street') filtered = scoped.filter(d => d.status === 'Уличная');
    if (dogSegment === 'home') filtered = scoped.filter(d => d.status === 'У владельца' || d.status === 'У опекуна');
    if (dogSegment === 'lost') filtered = scoped.filter(d => d.lost);
    if (dogSegment === 'seeking') filtered = scoped.filter(d => d.seekingHome);
    if (dogSegment === 'donors') {
      const minW = +document.getElementById('donorWeight').value;
      const vacc = document.getElementById('donorVacc').checked;
      const ster = document.getElementById('donorSter').checked;
      filtered = scoped.filter(d => d.isDonor
        && (Number(d.weightKg) || 0) >= minW
        && (!vacc || d.vaccinated === 'Да')
        && (!ster || d.sterilized === 'Да'));
    }
  }
  if (reg) filtered = filtered.filter(d => d.region === reg);
  if (q) {
    const tagQ = normalizeTag(q); // бирка: частичное совпадение от 4 знаков, кириллица=латиница
    filtered = filtered.filter(d =>
      (d.name || '').toLowerCase().includes(q) ||
      (d.breed || '').toLowerCase().includes(q) ||
      (d.color || '').toLowerCase().includes(q) ||
      (tagQ.length >= 4 && normalizeTag(d.tagNumber).includes(tagQ)));
  }

  const box = document.getElementById('dogsList');
  const addBtn = dogSegment === 'mine'
    ? `<button class="pop-btn" style="margin-bottom:12px" onclick="openAddDogSheet({status:'У владельца'})">➕ Добавить собаку</button>` : '';
  if (!filtered.length) {
    const msgs = { mine: 'У тебя пока нет анкет — добавь первую! 🐶', lost: 'Потеряшек нет — и это отлично 🎉',
      seeking: 'Сейчас никто не ищет дом', donors: 'По этим фильтрам никого — попробуй ослабить', all: 'Ничего не нашлось' };
    box.innerHTML = addBtn + `<div class="empty"><div class="big">🐾</div>${q ? 'По запросу ничего не нашлось' : msgs[dogSegment]}</div>`;
    return;
  }
  const statusIco = s => s === 'У владельца' ? '🏠' : (s === 'У опекуна' ? '🤝' : '🌳');
  box.innerHTML = addBtn + filtered.map(d => `
    <div class="card tappable" onclick="openDogCard(findDog('${d.id}'))">
      <div class="row-between">
        <div>
          <div class="list-title">${d.lost ? '🚨 ' : ''}${escapeHtml(d.name || t('pf_noname'))}</div>
          <div class="list-sub">${statusIco(d.status)} ${escapeHtml(d.status)} · ${escapeHtml(d.breed || 'порода не указана')}${d.region ? ' · ' + escapeHtml(d.region) : (d.city && d.city !== 'Тбилиси' ? ' · ' + escapeHtml(d.city) : '')}</div>
        </div>
        <div style="font-size:22px">${d.mine ? '💛' : '🐕'}</div>
      </div>
      <div class="badges">
        ${d.seekingHome ? `<span class="badge ok">${t('b_seeking')}</span>` : ''}
        ${d.isDonor ? '<span class="badge">🩸 донор ' + (d.weightKg ? d.weightKg + t('d_kg') : '') + '</span>' : ''}
        ${d.lost ? `<span class="badge warn">потерялась${d.lostDaysAgo != null ? ' · ' + d.lostDaysAgo + t('d_days') : ''}</span>` : ''}
        ${d.tagNumber ? '<span class="badge">🔖 ' + escapeHtml(d.tagNumber) + '</span>' : ''}
        ${!d.lat ? '<span class="badge">🗺 нет на карте — без координат</span>' : ''}
      </div>
    </div>`).join('');
}

async function submitBecomeSitter() {
  const nameEl = document.getElementById('sitName');
  const sitName = nameEl ? nameEl.value.trim() : '';
  if (nameEl && !sitName) { alert('Имя обязательно — его увидят владельцы собак 🙂'); return; }
  const bio = document.getElementById('sitBio').value.trim();
  if (!bio) { alert('Расскажи немного о себе — это твоя визитка.'); return; }
  const services = {};
  Object.keys(SITTER_SERVICES).forEach(k => services[k] = document.getElementById('svc_' + k).checked);
  if (!services.justWalking && !services.ownPlace && !services.withLiving) {
    alert('Выбери хотя бы один формат работы — так хозяевам понятнее.'); return;
  }
  const res = await callApi('becomeSitter', Object.assign({
    bio, name: sitName, phone: document.getElementById('sitPhone').value.trim(),
    price: document.getElementById('sitPrice').value.trim()
  }, services));
  if (!res.ok && res.error === 'name required') { alert('Укажи имя — его увидят владельцы собак.'); return; }
  if (res.ok) me = null; // имя могло обновиться — профиль перечитаем
  closeSheet();
  if (res.ok) { haptic(); sittersCache = null; loadSitters(true); setStatus('✅ Анкета опубликована!', 2200); }
  else alert(t('err_fail') + (res.error === 'service required' ? 'выбери хотя бы один формат' : (res.error || '')));
}
async function stopSitter() {
  if (!confirm('Убрать себя из списка ситтеров? Данные сохранятся — вернуться можно в любой момент.')) return;
  const res = await callApi('stopSitter', {});
  if (res.ok) { haptic(); sittersCache = null; loadSitters(true); }
  else alert(t('err_fail') + (res.error || ''));
}

function openReviewSheet(id, name, itemType) {
  openSheet(`
    <h3>Отзыв — «${escapeHtml(name)}»</h3>
    <div class="field"><label>${t('rv_rating')}</label>
      <div class="stars" id="starsPick" data-rating="0">${[1,2,3,4,5].map(n => `<span class="star" data-v="${n}" onclick="pickStar(${n})">☆</span>`).join('')}</div>
    </div>
    <div class="field"><textarea id="reviewText" maxlength="500" oninput="updCount(this,500)" placeholder="${t('rv_ph')}"></textarea></div>
    <button class="pop-btn" onclick="submitReview('${id}','${itemType}')">${t('cm_send')}</button>
  `);
}
function pickStar(n) {
  const box = document.getElementById('starsPick');
  box.dataset.rating = n;
  box.querySelectorAll('.star').forEach(s => { s.textContent = (+s.dataset.v <= n) ? '⭐' : '☆'; });
  haptic('success');
}
async function submitReview(id, itemType) {
  const rating = parseInt(document.getElementById('starsPick').dataset.rating || '0', 10);
  if (!rating) { alert(t('rv_need')); return; }
  const text = document.getElementById('reviewText').value;
  const res = await callApi('addReview', { type: itemType, id, rating, text });
  closeSheet();
  if (res.ok) {
    haptic();
    if (itemType === 'DogSitter') { sittersCache = null; loadSitters(true); }
    else { dataCache.places = null; renderLayer(); }
    setStatus('✅ Спасибо за отзыв!', 2000);
  } else alert(t('err_fail') + (res.error === 'self review' ? 'себя оценивать нельзя 🙂' : (res.error || '')));
}

let commentSubmitting = false;
async function submitComment(dogId, dogName) {
  if (commentSubmitting) return; // повторный тап, пока запрос в полёте, — игнорируем
  const field = document.getElementById('commentText');
  const text = field.value.trim();
  if (!text) { alert(t('cm_empty_text')); return; }
  const btn = document.getElementById('commentSendBtn');
  commentSubmitting = true;
  // Блокируем кнопку и показываем прогресс прямо на ней: раньше окно с введённым
  // текстом «висело» неизменным, и было неясно, ушёл ли комментарий — люди жали
  // второй раз и получали дубль.
  if (btn) { btn.disabled = true; btn.textContent = t('cm_sending'); }
  field.disabled = true;
  try {
    const res = await callApi('addComment', { dogId, text });
    if (res.ok) {
      haptic();
      // Дорисовываем комментарий на месте, без полной перезагрузки ленты через
      // промежуточный экран «Загружаю».
      const list = document.getElementById('commentsList');
      if (list) {
        const empty = list.querySelector('.empty');
        if (empty) empty.remove();
        const now = new Date();
        const stamp = String(now.getDate()).padStart(2, '0') + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + now.getFullYear() +
          ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `<div class="row-between"><span class="who">${escapeHtml(res.author || 'Ты')}</span></div>
          <div class="txt">${escapeHtml(text)}</div><div class="when">${escapeHtml(stamp)}</div>`;
        list.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      field.value = '';
    } else {
      alert(t('err_fail') + (res.error || ''));
    }
  } finally {
    commentSubmitting = false;
    field.disabled = false;
    if (btn) { btn.disabled = false; btn.textContent = t('cm_send'); }
  }
}
async function deleteComment(commentId, dogId, dogName) {
  const res = await callApi('deleteComment', { commentId, dogId });
  if (res.ok) { haptic(); showDogComments(dogId, dogName); }
  else alert('Не получилось удалить: ' + (res.error || ''));
}

  openSheet(`

      <div class="review-item">

// ================== МЕСТА: уточнение / добавление ==================
let pendingGeo = null;
function openSuggestSheet(current) {
  const id = current.id, name = current.name;
  const typeOpts = Object.keys(PLACE_TYPES).map(tk =>
    `<option value="${PLACE_TYPES[tk].label}" ${current.typeLabel === PLACE_TYPES[tk].label ? 'selected' : ''}>${PLACE_TYPES[tk].icon} ${PLACE_TYPES[tk].label}</option>`).join('');
  map.closePopup();
  openSheet(`
    <h3>Уточнить данные — «${escapeHtml(name)}»</h3>
    <div class="field"><label>Название</label><input type="text" id="sugName" value="${escapeAttr(current.name || '')}"></div>
    <div class="field"><label>${t('fp_type')}</label><select id="sugType">${typeOpts}</select></div>
    <div class="field"><label>${t('fp_addr')}</label><input type="text" id="sugAddress" value="${escapeAttr(current.address || '')}"></div>
    <div class="field"><label>${t('pf_phone')}</label><input type="tel" id="sugPhone" value="${escapeAttr(current.phone || '')}"></div>
    <div class="field field-row"><input type="checkbox" id="sugNight" ${current.night ? 'checked' : ''}><label style="margin:0">Круглосуточно</label></div>
    <div class="field field-row"><input type="checkbox" id="sugClosed" ${current.closed ? 'checked' : ''}><label style="margin:0">Сейчас не работает</label></div>
    <button class="pop-btn secondary" onclick="suggestPickGeo('${id}')">📍 Поправить точку на карте</button>
    <div id="geo-status"></div>
    <button class="pop-btn" onclick="submitSuggest('${id}')">Отправить на проверку</button>
    <button class="pop-btn danger" style="margin-top:8px" onclick="submitDelete('${id}','${escapeAttr(name)}')">🗑️ Предложить удалить место</button>
  `);
}
async function suggestPickGeo(id) {
  const vals = collectSuggestVals();
  const p = (dataCache.places || []).find(x => x.id.toString() === id.toString());
  const choice = await pickOnMap(p && p.lat ? [p.lat, p.lng] : null);
  const cur = Object.assign({}, p, vals, { id, night: vals.night, closed: vals.closed, typeLabel: vals.type });
  openSuggestSheet(cur);
  if (choice) { pendingGeo = choice; document.getElementById('geo-status').textContent = '✅ Новая точка выбрана'; }
}
function collectSuggestVals() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  return {
    name: g('sugName'), type: g('sugType'), address: g('sugAddress'), phone: g('sugPhone'),
    night: !!(document.getElementById('sugNight') || {}).checked,
    closed: !!(document.getElementById('sugClosed') || {}).checked
  };
}
async function submitSuggest(id) {
  const changes = collectSuggestVals();
  if (pendingGeo) { changes.lat = pendingGeo.lat; changes.lng = pendingGeo.lng; } // координаты как у собак
  const res = await callApi('suggestEdit', { type: 'Places', id, changes });
  pendingGeo = null;
  closeSheet();
  if (res.ok) { haptic(); setStatus('✅ Отправлено модератору', 2400); }
  else alert(t('err_fail') + (res.error || ''));
}
async function submitDelete(id, name) {
  if (!confirm(`Предложить удалить «${name}»? Место скроется после подтверждения модератором.`)) return;
  const res = await callApi('suggestEdit', { type: 'Places', id, changes: { _delete: true } });
  closeSheet();
  if (res.ok) { haptic(); setStatus('Запрос на удаление отправлен', 2400); }
  else alert(t('err_fail') + (res.error || ''));
}

document.getElementById('fab').onclick = () => {
  if (activeTab === 'dogs') { openAddStreetDog(); return; } // на слое собак — добавить уличную
  const typeOpts = Object.keys(PLACE_TYPES).map(tk =>
    `<option value="${tk}" ${(subFilter !== 'all' && subFilter === tk) ? 'selected' : ''}>${PLACE_TYPES[tk].icon} ${PLACE_TYPES[tk].label}</option>`).join('');
  openSheet(`
    <h3>${t('fp_title')}</h3>
    <div class="geo-note" style="margin-bottom:10px">${t('fp_hint')}</div>
    <div class="field"><label>${t('fp_type')}</label><select id="addType">${typeOpts}</select></div>
    <div class="field"><label>${t('fp_name')}</label><input type="text" id="addName" placeholder="${t('fp_name_ph')}"></div>
    <button class="pop-btn secondary" onclick="addPlacePickGeo()">${t('fp_pin')}</button>
    <div id="geo-status" style="font-size:12px;color:var(--hint);margin:4px 0">${pendingGeo ? t('fp_pin_ok') : ''}</div>
    <div class="geo-note" style="margin:6px 0">${t('fp_region_hint')}</div>
    <div class="field"><label>${t('fp_addr')}</label><input type="text" id="addAddress" placeholder="${t('fp_addr_ph')}"></div>
    <div class="field"><label>${t('pf_phone')}</label><input type="tel" id="addPhone" placeholder="+995…"></div>
    <div class="field"><label>${t('fp_link')}<span style="color:var(--hint);font-weight:400">${t('fp_optional')}</span></label>
      <input type="text" id="addLink" placeholder="https://maps.app.goo.gl/…">
      <div style="font-size:12px;color:var(--hint);margin-top:4px">${t('fp_link_hint')}</div>
    </div>
    <div class="field field-row"><input type="checkbox" id="addNight"><label style="margin:0">${t('fp_night')}</label></div>
    <button class="pop-btn" onclick="submitAddPlace()">${t('fp_submit')}</button>
  `);
  if (addPlaceDraft) {
    document.getElementById('addType').value = addPlaceDraft.type || document.getElementById('addType').value;
    document.getElementById('addName').value = addPlaceDraft.name || '';
    document.getElementById('addAddress').value = addPlaceDraft.address || '';
    document.getElementById('addPhone').value = addPlaceDraft.phone || '';
    document.getElementById('addLink').value = addPlaceDraft.link || '';
    document.getElementById('addNight').checked = !!addPlaceDraft.night;
    addPlaceDraft = null;
  }
};
let addPlaceDraft = null;
function snapshotAddForm() {
  addPlaceDraft = {
    type: document.getElementById('addType').value,
    name: document.getElementById('addName').value, address: document.getElementById('addAddress').value,
    phone: document.getElementById('addPhone').value, link: document.getElementById('addLink').value,
    night: document.getElementById('addNight').checked
  };
}
async function addPlacePickGeo() {
  snapshotAddForm();
  const choice = await pickOnMap(null);
  if (choice) pendingGeo = choice;
  document.getElementById('fab').onclick();
};
async function submitAddPlace() {
  const name = document.getElementById('addName').value.trim();
  if (!name) { alert('Укажи название'); return; }
  const payload = {
    type: document.getElementById('addType').value, name,
    address: document.getElementById('addAddress').value,
    phone: document.getElementById('addPhone').value,
    mapsLink: document.getElementById('addLink').value.trim(),
    night: document.getElementById('addNight').checked
  };
  if (pendingGeo) { payload.lat = pendingGeo.lat; payload.lng = pendingGeo.lng; }
  const res = await callApi('addPlace', payload);
  pendingGeo = null;
  closeSheet();
  if (res.ok) { haptic(); setStatus('✅ Появится на карте после проверки', 2600); }
  else alert(t('err_fail') + (res.error || ''));
}

// ================== ПРОФИЛЬ ==================
async function loadProfile(force) {
  if (me && !force) { renderProfile(); return; }
  const res = await callApi('getMe', {});
  if (!res.ok) { document.getElementById('profileBody').innerHTML = `<div class="empty">Не получилось загрузить профиль (${escapeHtml(res.error || '')})</div>`; return; }
  me = res;
  if (me.botUsername) BOT_USERNAME = me.botUsername;
  if (me.profile) syncLangFromProfile(me.profile);
  if (me.profile) centerMapByCity(me.profile.city);
  renderProfile();
}

// ================== ДАШБОРД ПРОДУКТА (только админ) ==================
// Все цифры считает сервер (computeMetrics_), клиент только рисует. Права проверяются
// на сервере по подписанному initData — открыть «в обход» через DevTools нельзя.
async function openAdminDashboard() {
  openSheet(`<h3>📊 Дашборд продукта</h3><div class="empty">Считаю метрики…</div>`);
  const res = await callApi('adminMetrics', {});
  if (!res.ok) { openSheet(`<h3>📊 Дашборд</h3><div class="empty">Не получилось: ${escapeHtml(res.error || '')}</div>`); return; }
  const m = res.metrics;
  const maxSeries = Math.max(1, ...m.series.newUsers, ...m.series.active);
  const spark = (arr) => arr.map((v, i) =>
    `<div class="${i === arr.length - 1 ? 'today' : ''}" style="height:${Math.round(v / maxSeries * 100)}%" title="${v}"></div>`).join('');
  // Воронка недели: сколько людей дошло до каждого шага
  const f = [
    ['Зарегистрировались', m.week.start],
    ['Открыли карту', m.week.mapUsers],
    ['Добавили собаку', m.week.dogAdded],
    ['Добавили место', m.week.placeAdded],
  ];
  const fMax = Math.max(1, ...f.map(x => x[1]));
  openSheet(`
    <h3>📊 Дашборд продукта</h3>

    <div class="sec-label">Живость</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="val">${m.users.d1}</div><div class="lbl">за 24 часа</div></div>
      <div class="kpi"><div class="val">${m.users.d7}</div><div class="lbl">за 7 дней</div></div>
      <div class="kpi"><div class="val">${m.users.d30}</div><div class="lbl">за 30 дней</div></div>
      <div class="kpi"><div class="val">${m.users.total}</div><div class="lbl">всего</div></div>
      <div class="kpi warn"><div class="val">${m.users.dormant}</div><div class="lbl">спят &gt;30 дн.</div></div>
      <div class="kpi"><div class="val">${m.users.noData}</div><div class="lbl">без данных</div></div>
    </div>

    <div class="sec-label">Ключевое</div>
    <div class="kpi-grid">
      <div class="kpi ${m.funnel.activation >= 30 ? 'good' : 'warn'}">
        <div class="val">${m.funnel.activation}%</div><div class="lbl">активация<br>(добавили собаку)</div></div>
      <div class="kpi ${m.funnel.retention >= 30 ? 'good' : 'warn'}">
        <div class="val">${m.funnel.retention}%</div><div class="lbl">возвраты<br>новичков</div></div>
      <div class="kpi"><div class="val">${m.dogs.total}</div><div class="lbl">собак<br>в базе</div></div>
    </div>
    <div class="list-sub" style="margin:-2px 2px 8px">
      Возвраты: ${m.funnel.cohortReturned} из ${m.funnel.cohortTotal} зарегистрировавшихся 2–14 дней назад.
    </div>

    <div class="sec-label">Новые пользователи, 14 дней</div>
    <div class="card">
      <div class="spark">${spark(m.series.newUsers)}</div>
      <div class="spark-x"><span>${escapeHtml(m.series.days[0])}</span><span>${escapeHtml(m.series.days[m.series.days.length - 1])}</span></div>
    </div>

    <div class="sec-label">Активные по дням, 14 дней</div>
    <div class="card">
      <div class="spark">${spark(m.series.active)}</div>
      <div class="spark-x"><span>${escapeHtml(m.series.days[0])}</span><span>${escapeHtml(m.series.days[m.series.days.length - 1])}</span></div>
    </div>

    <div class="sec-label">Воронка за 7 дней</div>
    <div class="card">
      ${f.map(([nm, v]) => `
        <div class="bar-row">
          <span class="nm">${nm}</span>
          <span class="bar-track"><span class="bar-fill" style="width:${Math.round(v / fMax * 100)}%"></span></span>
          <span class="cnt">${v}</span>
        </div>`).join('')}
      <div class="list-sub" style="margin-top:6px">Возвращались за неделю: ${m.week.returns} раз</div>
    </div>

    <div class="sec-label">Контент</div>
    <div class="card">
      <div class="info-row"><span>🏠 Домашних / 🌳 уличных</span><b>${m.dogs.home} / ${m.dogs.street}</b></div>
      <div class="info-row"><span>${t('dash_lost')}</span><b>${m.dogs.lost}</b></div>
      <div class="info-row"><span>${t('dash_stale')}</span><b>${m.dogs.staleStreet}</b></div>
      <div class="info-row"><span>${t('dash_pub')}</span><b>${m.places.total}</b></div>
      <div class="info-row"><span>${t('dash_mod')}</span><b>${m.places.onModeration}</b></div>
      <div class="info-row"><span>${t('dash_nogeo')}</span><b>${m.places.noGeo}</b></div>
    </div>
  `);
}

async function submitProfileEdit() {
  const cityEl = document.getElementById('prCity');
  const res = await callApi('updateProfile', { changes: {
    name: document.getElementById('prName').value,
    tel: document.getElementById('prTel').value,
    city: cityEl ? cityEl.value : undefined,
    lang: document.getElementById('prLang').value,
    showTg: document.getElementById('prShowTg').checked ? 'Показан' : 'Скрыт',
    lostAlerts: document.getElementById('prLostAlerts').checked
  }});
  closeSheet();
  if (res.ok) { haptic(); me = null; loadProfile(true); setStatus(t('pf_saved'), 2000); }
  else alert(t('err_fail') + (res.error || ''));
}
